  const seek=()=>{nv.pause();nv.currentTime=at;};if(nv.dataset.si!==String(n.si)){nv.dataset.si=n.si;nv.src=sc.src;nv.addEventListener('loadedmetadata',seek,{once:true});nv.load();}else seek();}

const D={"scenes": [{"name": "Sequential", "src": "media/videos/s01_sequential/1080p60/Sequential.mp4", "ends": [2.7, 8.5, 12.7], "notes": ["This is for engineers who use language models and have never seen the computation inside one. The spine is one sentence: a transformer is a stack of identical layers; in each layer every token gathers what it needs from every other token in a single parallel step, then each token is transformed on its own; stack that thirty to a hundred times and the last position predicts the next word. Five moves, on one picture that grows from these six tokens: the parallel idea, words becoming vectors, attention, the token thinking alone many times, and one token at a time. A sentence, six tokens. The question is how a network turns these into an understanding of the sentence. For years the answer was a recurrent network, and it had one property that shaped everything: it read the tokens in order, one at a time.", "The recurrent network carries a running state and updates it with one token at a time, left to right. Token six cannot be touched until token five is done. Reading a sentence of length six takes six steps in a row, a thousand tokens a thousand steps, and no amount of hardware shortens a line you must walk end to end. That is the sequential bottleneck, and it is why these networks were slow to train and forgot the far past.", "The transformer throws out the running state. Every token looks at every other token directly, and all of those connections are computed in the same step, in parallel, however long the sentence. The sequential count drops to one. The cost is on the right: the connections grow with the square of the length, thirty here, a million at a thousand tokens, which is why long contexts are expensive and why the field keeps trying to thin this picture out. But it is work a GPU can do all at once, and that trade, more arithmetic for fewer steps, is the whole reason transformers won. The rest of the talk is how one of those connections actually works. First, the tokens have to become numbers."]}, {"name": "Embedding", "src": "media/videos/s02_embed/1080p60/Embedding.mp4", "ends": [1.0, 2.6, 9.5, 11.9, 14.9], "notes": ["The connections come off and the six tokens settle: the same sentence, now with the text it came from above it. A neural network does not work on letters; it works on numbers. So the first two jobs are to cut the text into pieces and turn each piece into a list of numbers.", "Tokenisation. The text is cut into tokens, whole common words here, and each token is a number, its id, an index into a fixed vocabulary. This model's vocabulary is 50,257 entries, built by byte-pair encoding: start from single bytes and repeatedly merge the most frequent pair, so common words end up as one token and a rare word splits into a few. Two things to notice: both \"The\" and \"the\" are tokens, with different ids, and the model has not yet been told anything about them beyond a number.", "The lookup. The model holds a table with one row per vocabulary entry, and each row is a list of learned numbers, a vector; 512 of them in the original transformer, drawn here as eight. A token's id just picks its row. These numbers are learned in training so that tokens used in similar ways get similar vectors, which is where meaning starts to live. After this step the sentence is a row of vectors, and everything downstream is arithmetic on them.", "One problem, and it is the reason for the next step. The attention we are about to build looks at these vectors as an unordered set: \"the cat sat\" and \"sat the cat\" would come out the same, because nothing in a vector says where it sits. But order carries meaning. So before anything else, each vector is given its position.", "The fix is simple and a little surprising: add a second vector to each token that depends only on its position, made from sines and cosines of different frequencies in the original paper. Same word, different place, different vector now. From here the vectors carry both what the token is and where it sits, and we never look at the raw text again. Now the heart of the machine: letting these vectors read one another."]}, {"name": "Attention", "src": "media/videos/s03_attention/1080p60/Attention.mp4", "ends": [1.0, 5.9, 7.699, 9.099, 13.199, 14.899, 20.899], "notes": ["The six vectors rise to the top and stay there for the rest of the talk; the text has done its job. Each carries what its token is and where it sits. A word's meaning depends on its neighbours: \"bank\" near \"river\" is not \"bank\" near \"money\". Attention is how each token pulls in what it needs from the others. It starts by giving every token three different views of itself.", "Take the last token, \"mat\", and bring its vector down. Three matrices, learned in training, and here is the arithmetic once, slowly. One output number is one row of a matrix times the vector: each number in the row multiplies the number beside it in the token's vector, and the products are summed into one cell. This is the operation every layer is built from, done here for the first cell of the query.", "Now every row of all three matrices. The token's vector becomes three short vectors, 64 numbers each in the paper, drawn as three. Their names describe the roles they will play. The query is what this token is looking for. The key is how it advertises itself to others' queries. The value is what it will hand over when its key is a good match. Just learned numbers; the names come from how they are used next.", "The same three matrices run on every token, all at once, giving each its own query, key and value. That \"all at once\" is the parallel step from move one. Now the read: we follow one token's query, the last, \"mat\", and let it gather from the rest.", "The query of \"mat\" is compared with the key of every token, by the same multiply-and-sum, one score per token. A big score means that token's key matches what \"mat\" is looking for. In the original paper the score is divided by the square root of the key length before the next step, so the numbers do not blow up as vectors get longer. Six scores, one per token, and they can be any size.", "Raw scores are not yet a mixture. Softmax turns them into weights between zero and one that add up to one: the exponential of each score over the sum of them all. The biggest score gets most of the weight, the rest little. These are the attention weights: \"mat\" pays this much attention to each token, and this row of bars is exactly what people mean by an attention pattern.", "Last step of the read, and watch the new vector fill. Take every token's value, scale it by that token's weight, and add them up: a big weight brings most of that token's value, a small weight almost none. Six landings, and the sum is a new vector for \"mat\", built from the whole sentence, weighted by relevance. Every token does this for its own query at the same time, so one attention step rewrites all six vectors in parallel. Two things still to add: a language model must not peek ahead, and one view of the sentence is not enough."]}, {"name": "MaskAndHeads", "src": "media/videos/s04_maskheads/1080p60/MaskAndHeads.mp4", "ends": [1.0, 4.6, 5.6, 9.6], "notes": ["The bars we just computed fold into the bottom row of a grid: the row is the token doing the looking, the column is the token being looked at, and every cell is one attention weight. \"mat\" attending to all six is the row we built; the other five rows are the same computation for the other tokens, all done at once. Filled in full, this is every token attending to every token, the parallel read drawn as a grid. For a model that understands a whole sentence at once, that is what you want.", "But a language model is trained to predict the next word, so it must not see the answer. When it is deciding what comes after \"sat\", it cannot be allowed to look at \"on the mat\", or predicting would be copying. The causal mask blocks the upper triangle: each token attends only to itself and the tokens before it. This one change is the whole difference between a model that reads and a model that writes, and it is why this lower-triangle shape shows up everywhere in this field.", "One point of view is not enough. A single query, key and value can track one kind of relationship, say the subject of a verb. So attention runs several times in parallel, each with its own three matrices: the heads. The original transformer used eight, drawn here as three. Each head does the whole read we just built and produces its own short output vector for the token, capturing a different relationship.", "The heads' outputs are stitched into one long vector and passed through one more learned matrix that mixes them and brings the length back to the token's size, the same sweep as before. That single vector, the shape the token's vector had going in, is the output of the whole attention block: the token, updated with what it gathered from the sentence through several different lenses at once. That is attention, start to finish. Now the other half of a layer, where each token is worked on by itself."]}, {"name": "Layer", "src": "media/videos/s05_layer/1080p60/Layer.mp4", "ends": [1.0, 2.9, 3.7, 4.9, 10.667, 15.432], "notes": ["Attention let every token gather from the others; its output for \"mat\" comes to the centre. The second half of a layer does the opposite: it works on each token entirely by itself, the same small network applied to every position independently. Its job is to take what the token just gathered and compute something new from it.", "First it expands. A matrix multiplies the vector up to four times its length, 512 to 2048 in the original paper, drawn here eight to sixteen. This gives the network room: many more numbers, each a different learned combination of the token's features, room to represent things the compact vector could not.", "Then a nonlinearity, ReLU in the paper: every negative number is set to zero, the cells that went dark. This is small but it is the point of the whole block. Without it, stacking layers would collapse into one big matrix and the model could only draw straight lines. The nonlinearity is what lets the network build up complicated functions, layer on layer.", "A second matrix contracts it back to the original length. So the feed-forward block is expand, throw away the negatives, contract. Out comes a vector the same size as the token's, an update the network computed from this token alone. The vast majority of a model's weights live in these two matrices, repeated in every layer.", "Now the piece that makes deep stacks trainable at all. The update is not the new vector; it is added to the vector that came in, number by number, and each cell of the token shifts a little. The token's own representation flows straight through, and each block only nudges it. This residual connection, one around attention and one around the feed-forward, is why gradients survive a hundred layers and why a layer can safely learn to do almost nothing when that is best. The paper also normalises after each add; that keeps the numbers in range and does not change the shape of the story.", "And that is the whole layer: gather from the sentence with attention, then transform each token alone with the feed-forward, both wrapped in residual adds. Here it is again, smaller, five times: a vector goes in, becomes a query, a key and a value, reads the row, passes the feed-forward grid, comes out the same shape. Six layers in the original paper, thirty to a hundred in a modern language model, every layer with its own weights, each refining the vectors a little more. The vector that falls out of the bottom has been shaped by the whole sentence, many times over. One thing left: turning that vector into the next word."]}, {"name": "Predict", "src": "media/videos/s06_predict/1080p60/Predict.mp4", "ends": [1.0, 4.8, 5.8, 6.6, 8.6, 9.6], "notes": ["The stack is done and one vector falls out of it. Look at the row: \"mat\" has stepped out, because that is the word the model has not seen yet; the sentence it has is \"The cat sat on the\", and the last position, \"the\", has been shaped by the entire sentence and carries everything the model knows about what should come next. We only need this one vector: whatever the last token has become is the model's summary of \"what word follows\".", "Turning a vector into a word uses the same trick as the very first step, run backwards. A matrix with one row per vocabulary entry multiplies the vector, the same sweep as in every layer, giving one score per possible next token: 50,257 numbers. In fact this is usually the same table used for the embeddings at the start, shared. A high score means the model thinks that token is a likely continuation.", "Softmax again turns the scores into probabilities that sum to one: the model's guess at the next word, spread over every token it knows. Most get almost nothing; a few are plausible. The engine then samples from this distribution. Take the highest and the output is predictable; sample with some randomness and it is more varied. That choice is the \"temperature\" setting people tune.", "One token is drawn, \"mat\". That is the model's entire output for one pass through the whole stack: a single next token. Everything we have built, the embeddings, dozens of layers of attention and feed-forward, hundreds of billions of multiplications, produces exactly one word.", "Then the sampled word is appended: \"mat\" takes its place at the end of the row, in the colour of something the model wrote, and the entire model runs again, now with one more token, to produce the word after that. And again, and again. This is why a language model streams its answer one word at a time, and why a long answer costs many full passes through the stack. Everything you have seen happens for every single token you have ever watched one of these models type.", "One last thing, to place what you have seen. This whole machine is inference: the weights are fixed and it writes one token at a time. Training is the same arithmetic run in bulk, predicting the next token at every position of a huge corpus and nudging all those matrices, the embedding table, the query, key and value matrices, the feed-forward weights, until the predictions are good. That is a transformer: turn words into vectors, let every token gather from every other in parallel and then think alone, stack that many times, and read the next word off the end."]}], "steps": [{"scene": "Sequential", "si": 0, "k": 0, "note": "This is for engineers who use language models and have never seen the computation inside one. The spine is one sentence: a transformer is a stack of identical layers; in each layer every token gathers what it needs from every other token in a single parallel step, then each token is transformed on its own; stack that thirty to a hundred times and the last position predicts the next word. Five moves, on one picture that grows from these six tokens: the parallel idea, words becoming vectors, attention, the token thinking alone many times, and one token at a time. A sentence, six tokens. The question is how a network turns these into an understanding of the sentence. For years the answer was a recurrent network, and it had one property that shaped everything: it read the tokens in order, one at a time."}, {"scene": "Sequential", "si": 0, "k": 1, "note": "The recurrent network carries a running state and updates it with one token at a time, left to right. Token six cannot be touched until token five is done. Reading a sentence of length six takes six steps in a row, a thousand tokens a thousand steps, and no amount of hardware shortens a line you must walk end to end. That is the sequential bottleneck, and it is why these networks were slow to train and forgot the far past."}, {"scene": "Sequential", "si": 0, "k": 2, "note": "The transformer throws out the running state. E
