const D={"scenes": [{"name": "OneList", "src": "media/videos/s01_list/1080p60/OneList.mp4", "ends": [1.3, 3.3, 6.1, 8.8], "notes": ["The whole talk opens on this picture, nothing moving yet; the title says where we are. On the left, your laptop: the program that has a name and needs an address. In the middle, the oldest idea on the internet: one list that every machine holds, a name on the left and its address on the right, a hosts file. Everything in this talk is what happened to that list.", "Start with the job. A program has a name, www.example.com, and needs an address, because packets are sent to addresses, not names. The first design, and the one the early internet ran on, is a list: every machine keeps a file of names and addresses and looks the name up. It works, and it is what your laptop still does first: the hosts file is that list, a few lines long today.", "Now the internet grows. Hundreds of millions of names under .com alone; the list runs off the bottom of the frame and keeps going. Every machine needs the whole of it, because any machine may ask for any name. That is the first failure: size. Nobody can hold the list, and nobody can hand it out fast enough to keep it current.", "The second failure is change. The owner of example.com moves it to a new address and edits the master list. Every copy in the world is now wrong until it is replaced, and there is no way to know which copies have been. One copy here has the new address; two still have the old one, and will send traffic to a machine that is gone. So a design that scales has to do two things: split the list so that nobody holds all of it, and make the answer say how long it may be trusted. Those are the two rules of the talk, and the next move is the first."]}, {"name": "Delegation", "src": "media/videos/s02_delegation/1080p60/Delegation.mp4", "ends": [1.0, 2.6, 5.7, 6.8, 8.7, 10.6, 13.95], "notes": ["The list is gone; one name from it stays and grows, with the dot at the end that is usually invisible, and the laptop that wanted its address is still there. Nothing else yet. Look at the name itself before the machinery: it is not one word, it is a path, and the next click reads it the way DNS does.", "Split the list along the name itself. A name is read from the right: the final dot, usually invisible, is the root of the whole tree; then com, one of 1,393 top-level domains; then example, a name registered under com; then www, a host inside it. Each label is one level, and the levels nest, so a name is a path from the root down to the thing you want. RFC 1034 wrote the tree this way in 1987, and it has not changed.", "Each level is a zone: a piece of the name space that one party is authoritative for, served from that party's servers. The root zone is run by twelve organisations on thirteen server names, spread today over 2,045 anycast instances. The com zone is run by a registry. The example.com zone is run by whoever registered it, on servers they chose. Look at what each zone holds. The root does not know the address of www.example.com; it holds one kind of record about com: an NS record, a pointer saying \"com's servers are these\". The com zone holds the same kind of pointer for example.com. Only the bottom zone holds the address, an A record. A zone holds the pointers to the zones below it and nothing else about them: that is delegation, and it is why nobody has to hold the whole list. The number at the right of each record is its time to live; hold that thought for move three.", "Two actors do the asking. Your laptop's stub resolver, a library inside the operating system, asks exactly one question and waits for one answer: it sets the recursion-desired bit and lets someone else do the work. That someone is the recursive resolver, usually run by your network, your company, or a public service such as 1.1.1.1 or 8.8.8.8. It walks the tree on your behalf, and it has a cache, which is the whole of move three. Watch the walk.", "Hop one. The resolver knows the root servers' addresses by configuration; that is the one list everyone does hold, and it is thirteen lines long. It asks a root server the full question. The root is not authoritative for the name and says so with a referral: an NS record, a pointer to com's servers, with their addresses attached as glue so the resolver does not need a second lookup to find them. The resolver keeps the pointer; it will be worth a great deal.", "Hop two. The same question to one of com's servers. Com is not authoritative for www.example.com either; it holds the pointer to example.com's servers, hera and elliott at Cloudflare in this case, and returns it. Another referral, another record kept. Every answer so far has been a pointer to who to ask next: rule one.", "Hop three. The example.com servers are authoritative for the name: they hold the A record and return the address. The resolver keeps it and sends it home to the laptop, which never saw the walk: one question out, one answer back. Three round trips to three different organisations to turn one name into one address, and none of them held the whole list. That is delegation. It solved size. It made every lookup three times slower than a table scan, and the root servers would answer every lookup on earth. Rule two fixes both."]}, {"name": "Caching", "src": "media/videos/s03_caching/1080p60/Caching.mp4", "ends": [1.0, 2.9, 9.5, 15.5, 17.1], "notes": ["Same picture, one addition: under each record the resolver kept, a teal bar, its time to live, running out from the moment it arrived; and at the bottom left the hop counter, at three, what the first walk cost. Watch what the second question costs.", "Rule two. The walk left three records in the resolver's cache, each with the time to live its zone attached: the teal bar under each row is that time, running out. Now the same laptop, or any of the thousands of others behind this resolver, asks for www.example.com again. The address is in the cache and its time has not run out, so the answer comes straight back: zero hops into the tree, no root server, no registry, no example.com server involved. This is why the root servers are not answering every lookup on earth.", "A different name, mail.other.com, under com as well. The resolver already holds the pointer to com's servers, so it does not ask the root: it goes straight to com, gets the pointer to other.com, asks other.com, gets the address. Two hops instead of three, and the root was not involved. Now read the times to live the zones chose. The root tells resolvers to keep its pointers for six days; com says two days for its pointers; example.com says five minutes for the address. The pointers near the top change almost never and are wanted by almost every lookup, so they are remembered longest; the address at the bottom changes when the owner moves servers, so it is remembered briefly. The expensive part of the walk is the part that is cached longest. That is the design.", "Time passes; five minutes here, compressed. The address's time to live runs out and the row may no longer be used; the pointers above it have barely aged. The next lookup for the name is a miss: the resolver still knows example.com's servers, so it asks them directly and gets a fresh address with a fresh five minutes, one hop, not three. A hit costs no network at all; a miss costs a round trip to a server somewhere on the internet, on average about 130 milliseconds by Google's measurement of its resolvers, and a few percent of those servers do not answer in time. Cache misses are the dominant cause of slow lookups. Everything about the times to live is a trade between that cost and the next move's problem.", "The resolver is not the only cache. The browser keeps answers, the operating system's stub keeps answers, and each of them counts the same time to live down from where it received it: a record that left the resolver with 300 seconds arrives in the browser with 281, and the browser may keep it for 281 more, not 300. The answer carries its own expiry and every party respects it. So a lookup is answered by the nearest cache that still holds a fresh copy, and the tree is consulted only for what nobody nearby remembers. That is rule two at work, and it makes the system fast. It is also, exactly, what makes changes slow."]}, {"name": "Price", "src": "media/videos/s04_price/1080p60/Price.mp4", "ends": [1.0, 4.9, 8.6, 13.3, 19.3], "notes": ["The owner's zone from the bottom of the tree comes forward and takes the top of the frame; the rest of the tree has done its job. Under it, four resolvers around the world, each holding its own copy of the one record that matters, five minutes to live, each with its own bar of time left, all different because each fetched the record at a different moment. Nothing has changed yet.", "The owner moves www.example.com to a new address and changes the record. Nothing tells the resolvers. Each keeps its copy of the old address until that copy's time runs out, and their clocks started at different moments, so they expire one by one: Tokyo first, then Dublin, Virginia, Stockholm. Until then, users behind a stale resolver reach the old machine. There is no propagation mechanism in DNS; there is only expiry. \"Propagation time\" is the time to live of the record you changed, as seen from the slowest cache.", "So the trick every operator learns. Before a planned move, lower the record's time to live to a minute and wait at least one old time to live, so that every cached copy in the world has been refreshed with the short value. Then change the address: every copy now expires within a minute and the whole internet follows. Then raise the time to live again, because a short one means many misses and misses are what makes lookups slow. The time to live is a dial between how fast you can change and how cheap lookups are, and the owner of the zone holds it.", "The most expensive miss is a name that does not exist: a typo, a decommissioned host, a probe. Nothing is cached, so every such question walks to the authoritative servers, which answer \"no such name\". If the resolver forgot that \"no\" at once, the same typo from the next user would walk again. So the answer \"no\" is cached as well, and its time to live comes from the zone's SOA record, the record that describes the zone itself: its minimum field, redefined by RFC 2308 to mean exactly this, thirty minutes for example.com today, with one to three hours the suggested range. Negative caching is why a misspelt name is fast the second time, and why a name you have just created can take half an hour to exist for someone who asked for it a minute too early.", "One more kind of pointer, and it is rule one again. Instead of an address, a name can hold an alias, a CNAME, that says \"this name is really that other name\". Content networks live on it: www.example.com points at a name in the network's own zone, so the network can change addresses without touching the customer's zone. The resolver treats the alias as a pointer and restarts the walk for the new name, possibly through a different top-level domain, with its own pointers and its own times to live; both answers come back together. A name with a CNAME may hold nothing else, which is why the apex of a zone cannot be an alias, a rule that has cost many people an afternoon. Rule one, applied to names instead of servers."]}, {"name": "Standing", "src": "media/videos/s05_close/1080p60/Standing.mp4", "ends": [1.4, 2.8, 4.9, 9.9], "notes": ["The root of the tree: thirteen server names on the left, and on the right the world with the places those thirteen names are actually answered from, two thousand and forty-five of them, one dot per dozen. Nothing moves until a resolver asks.", "The root of the tree is the one list everyone holds, thirteen server names run by twelve organisations, and if thirteen machines answered the world the system would not stand. They do not. Each of the thirteen addresses is announced into the internet's routing from many places at once, anycast, so a packet sent to a.root-servers.net from Sydney reaches an instance in Sydney. Today the thirteen names are 2,045 instances. The same is true of the big top-level domains and the large public resolvers. The tree's top is small in names and enormous in machines, which is what lets its pointers be cached for days without anyone worrying about load.", "The messages themselves are small. A question is a single UDP packet to port 53: a header with an id and a few flags, and one question: a name, a type, a class. An answer carries three lists: the answer records, the authority records, which is where the pointers of a referral travel, and the additional records, which is where the glue addresses of those servers travel so that the resolver need not look them up. The classic limit is 512 bytes; a server with more to say sets the truncation flag, and the client repeats the question over TCP. One packet each way is why a cache hit at the resolver is answered in the time it takes a packet to cross a building.", "The whole picture once more, with the two rules written under it. A name is a path; each level of the path is a zone someone owns, holding pointers to the level below; a lookup walks the pointers until one answer is the address. Every party that hears an answer keeps it for exactly as long as the answer said, so the top of the tree is asked rarely and the bottom often, changes arrive by expiry and never by push, and a \"no\" is remembered like a \"yes\". When a name resolves differently in two offices, when a change takes an hour to land, when a typo is slow once and fast after: you are watching the two rules. Thank you."]}], "steps": [{"scene": "OneList", "si": 0, "k": 0, "note": "The whole talk opens on this picture, nothing moving yet; the title says where we are. On the left, your laptop: the program that has a name and needs an address. In the middle, the oldest idea on the internet: one list that every ma
