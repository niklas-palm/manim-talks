<script>
const ch=new BroadcastChannel('talk');const t0=[Date.now()];let aud=null;
const tell=m=>{ch.postMessage(m);if(aud&&!aud.closed)aud.postMessage(m,'*');};
let onstep=k=>{const s=ST[k],n=ST[k+1];document.getElementById('pos').textContent=(k+1)+' / '+ST.length;document.getElementById('scene').textContent=s.scene;
document.querySelector('#note h3').textContent=s.scene.replace(/([a-z])([A-Z])/g,'$1 $2');document.getElementById('txt').textContent=s.note;
document.getElementById('nextnote').textContent=n?('next: '+n.scene+(n.scene!==s.scene?' (new scene)':'')+'. '+n.note.slice(0,240)+(n.note.length>240?'...':'')):'end of talk';
preview(n);};
function preview(n){const nv=document.getElementById('n');if(!n){nv.removeAttribute('src');nv.load();return;}const sc=S[n.si],at=Math.max(0,sc.ends[n.k]-0.05);   // the last frame of the next step: where 'next' will end up
  const seek=()=>{nv.pause();nv.currentTime=at;};if(nv.dataset.si!==String(n.si)){nv.dataset.si=n.si;nv.src=sc.src;nv.addEventListener('loadedmetadata',seek,{once:true});nv.load();}else seek();}

const D={"scenes": [{"name": "Mechanics", "src": "media/videos/s01_mechanics/1080p60/Mechanics.mp4", "ends": [1.7, 4.0, 8.75, 9.75, 11.85, 17.133, 18.932, 20.632, 23.365, 31.815, 36.515, 38.915, 40.915, 45.865, 59.73, 68.976, 70.776], "notes": ["This talk is for engineers who will host a model, or buy hosting, and want to know what they are paying for. No product, no vendor; one stack we built to measure things, and the numbers it produced. One sentence carries the whole talk: a model reads your prompt once, then writes one token at a time, and every hosting decision is about which of those two you are paying for. Seven moves: two jobs and their costs, why the engine batches, four knobs, more than one GPU, what precision costs in answers, the fleet, and where the industry is. Start from actual text: a prompt someone typed. Five words. We follow them through the machine and out the other side, on one picture that only grows. Everything later in the talk is a consequence of what happens on this picture, so it is worth twenty minutes.", "Tokenisation. The text is cut into tokens, whole words here and pieces of words in general, and each becomes an integer from a vocabulary of thirty to two hundred thousand entries. The model never sees letters, only these integers. The two 'the's differ, capitalised and not: two entries.", "Embedding: each integer selects a row of a table; the token is now a vector of numbers. Then the lookup. The model holds a table with one row per vocabulary entry, a few thousand numbers in each row, learned like every other weight. Each integer selects its row, and that row is the token from now on: a vector, a column of numbers, drawn as eight shaded cells. Five tokens, five vectors, and the two 'the's are different rows. This is the only step where the integer matters; everything after this is arithmetic on these columns.", "The stage; everything from here on happens on it. The five vectors wait at the top. Left, the model: a stack of layers, four drawn of thirty to a hundred, each a set of weight matrices sitting in GPU memory. Right, the KV cache, empty: one column per token, one row per layer. At the edge, the two gauges the talk is about: how busy the memory bus is, moving bytes from memory into the chip, and how busy the arithmetic units are. Two counters at the bottom keep score.", "Inside one layer: the five vectors arrive together as a block, and the layer opens up. This is prefill, and we go inside it. The five vectors line up as a block, side by side, and go into layer one together. Zoom in and let the layer open up. The block arrives at the left. Everything the layer does, it does to this block: the same arithmetic on each of the five columns. Watch what that means for the weights.", "One row of the matrix, read once, multiplies all five vectors: five output numbers for one read. Three weight matrices sit in the layer, and here is the arithmetic, once, slowly. One output number is one row of the matrix against one vector: each number in the row multiplies the number beside it in the vector, the eight products are summed, and the sum is one cell of the output. Now the point of the block. The row came in from memory once, and it stays lit while all five vectors take their turn against it: five multiplications, five output numbers, one read. In a real model the row and the vector are four thousand long, not eight, and the block is every token of the prompt. Everything a layer does is this operation, repeated.", "Every row in turn: three matrices read once each give a query, a key and a value for all five tokens. Now every row, at speed, for all three matrices. Each row lights once and fills one cell in each of the five output columns. Filling the outputs touched every cell of all three matrices: to use a weight it has to come in from memory, so producing these outputs meant reading the matrices in full, once, for five columns of work. The outputs have names. The query is what a token is looking for in the tokens before it. The key is how it will answer other tokens' queries. The value is what it hands over when its key matches. Learned numbers, nothing more; the names describe the roles they end up playing.", "The keys and values are stored: this layer's row, one column per token. That is the KV cache. The keys and the values are stored in the cache, in this layer's row, one column per token, and they stay for the life of the request. That is the whole content of the KV cache: for every token, in every layer, its key and its value. Later tokens need them, and recomputing them would mean re-running every earlier token through every layer. Storing them is what makes the cache; reading them is what will make the cache expensive.", "Attention: each query is scored against the keys up to its own; the weighted values form five new vectors. Now the queries do their work. Each token's query is compared with the keys of the tokens up to and including itself, one score per pair, and the values are added up weighted by those scores. The result is a new vector for each token that carries what it needed from its context. Two things to hold on to. This is the only place tokens influence each other. And every query reads the cache row: every key, every value, for every token before it. Five cells here; sixty thousand at a long context.", "Feed-forward, most of the weights, read once for five columns of work. Then layer two, the same, at speed. Then the big multiplication. The feed-forward part holds most of the layer's weights, in a real model tens of millions of numbers per layer, and it is the same arithmetic: one row per output number, read once, used for all five columns, and the highlight has touched every cell by the time the output block is full. That is prefill's shape: the weights come in once, and every byte that arrives does five columns of arithmetic, so the arithmetic units are the busy ones and the bus has slack. The output block is five vectors of the same shape as the input, and it drops into layer two, which has its own three matrices, its own cache row and its own feed-forward, and does exactly the same thing at speed: project, store five keys and values, attend, feed-forward, hand on. Thirty to a hundred times. So one layer, one block: read all the weights once, write one cache cell per token.", "Prefill, the rest of the stack: each layer reads its weights once, for five columns of work. Back out. Two layers done, two rows of the cache filled, and the block continues down the rest of the stack at the speed it really happens: in each layer the matrices come in from memory once and are used five times, one column of arithmetic per token, so the compute gauge is the busy one and the bus is not; the small label under the gauges keeps that ratio. Each layer writes five keys and values into its cache row. The counter says what it cost: one read of the model for the whole prompt. A longer prompt costs more arithmetic, not more reads.", "The last position's output becomes a probability over the vocabulary; one token is sampled. At the bottom, the last position's vector is multiplied by one more matrix, one row per vocabulary entry, which gives a score for every token the model knows. Normalise, and it is a probability distribution; draw from it, and the answer has its first token, 'mat'. It joins the sentence. Prefill has done two things: filled the cache with the prompt, and produced one token.", "Decode: the sampled token goes back in alone, the same lookup, one vector. Decode. The sampled token goes back in, alone: the same lookup, its row of the table, one vector above layer one. Watch the gauges swap: the bus is pegged and the compute grid nearly idle. To see why, go back inside the layer with this one column.", "Decode inside the layer: the same stages, for one column. Weights read in full; cache read in full. Inside, decode is prefill for one token; nothing is skipped. The same three matrices, read in full, give this token its query, key and value, one column of arithmetic per row instead of five. Its key and value go into the cache as the sixth column of this layer's row. The label over the matrices is the point: exactly the bytes prefill read, for a fifth of the work.", "Decode: one token per step; each step reads the whole model plus every cached key and value. Then the query does its work over the whole row, six keys now, and the feed-forward sweeps in full for this one column. The output drops into layer two, which does the same at speed: project, store, attend, feed-forward. Back out, and the column goes on down the stack: in every layer the matrices are read in full again for one column of work, the query fans out over the cache row, the white lines, every stored key and value lights up as it is read, and its own key and value go in as a new column. The new counter is the size of that read. At the bottom a token is sampled and joins the sentence. One token: one full read of the model plus one full read of the cache. A GPU multiplies far faster than its memory delivers numbers: hundreds of operations in the time one byte arrives. With five columns per read the arithmetic units had work while the next weights came in; with one column they finish at once and wait for the bus. Same bytes, a fifth of the work per byte: that is why decode is bound by memory bandwidth, and why the bus gauge is the one that is pegged.", "Prefill: one read for the whole prompt. Decode: one read plus the cache, per token. The loop runs on without a click, and watch the cache counter: each token adds a column, so every later token reads one more cell per layer; the read grows with the length of the conversation. The weight read is the same every step; the cache read is not. On one request it is small next to the weights. With many requests in flight the weights are read once for all of them, while each request's cache is read on its own, and at long contexts it is the cache read, not the weights, that fills the bus. The answer arrives one token per loop, which is why it streams word by word. The counters are the summary of the talk so far. Prefill: one read of the model for the whole prompt, five columns of work per weight, arithmetic-bound. Decode: one read of the model plus a read of a growing cache for every token, one column per weight, bandwidth-bound. Same multiplication, opposite bottleneck, and the gauges showed which one at each moment. Everything that follows is about those two gauges: what they cost, and how to move them.", "The whole stage then folds into one GPU drawing, because the next question is about the machine. The still picture first. Left, one GPU: the RTX PRO 6000 Blackwell Server Edition, the card in a g7e instance, 96 GB of memory, and its bus gauge pegged because we are about to ask what the bus can do at most. Right, the model, named: a dense 32B in fp8, one byte per weight, so every token reads all 32 GB. Two numbers from two spec sheets, the card's bandwidth and the model's bytes per token. The next click divides one by the other."]}, {"name": "DecodeCeiling", "src": "media/videos/s02_ceiling/1080p60/DecodeCeiling.mp4", "ends": [1.4, 4.4, 6.0, 9.6, 11.2], "notes": ["RTX PRO 6000 Blackwell Server Edition, 96 GB GDDR7: the GPU in a g7e instance. Two words for the rest of the talk. Latency is how fast one request gets its tokens; throughput is how many tokens the whole GPU produces per second for everyone. Start with latency, because it has a ceiling anyone can compute before renting anything, from two numbers. The card: this is the RTX PRO 6000 Blackwell Server Edition, the GPU inside a g7e instance, 96 GB of GDDR7, and its spec sheet says it moves 1.6 terabytes per second; the 1.8 often quoted is the workstation card. The model: a dense 32B in fp8 reads every weight for every token, 32 GB. Divide, and no request on this card can decode faster than 50 tokens per second, 20 milliseconds between tokens, whatever the software does. Do this division for any model you are considering; it is the per-user speed limit in ten seconds.", "The model this talk measures is built differently: 30B weights in total, but only about 3B of them are read for any one token. How it manages that is knob two, later; for now take the number. 3 GB per token against the same 1.6 terabytes per second gives about 530 tokens per second for one request, under two milliseconds between tokens. Ten times the dense ceiling, from the same card, because the token reads a tenth of the bytes.", "throughput: tokens per second from the whole GPU. Here 175: with one request, the two are the same number. Measured alone, the same request decodes at about 175 tokens per second, 5.7 milliseconds between tokens, a third of its ceiling. The gap is overhead per step: a few hundred kernel launches, the scheduler, the expert router, none of which is bandwidth. Watch the gauge: we measured the memory controller busy 39 percent of the time with one request in flight; the rest of the time the bus is idle. Now the two words, written down. Latency: 5.7 milliseconds between this request's tokens. Throughput: 175 tokens per second from the whole GPU, and with one request that is the same number, because one request is all there is. Hold on to the idle bus.", "The same division on a different card, because the card is half the answer. The H100 in a p5 instance moves 3.35 terabytes per second, twice this card's 1.6, so both ceilings double: 105 tokens per second for the dense 32B, about 1,120 for this model, under a millisecond between tokens. That is what hardware buys, and it is the only thing that raises this line; no engine setting does. Then the measurement, the other half. At eight requests in flight this model decoded at 67 tokens per second per request here and 102 on the H100; the dense 27B in fp8 went from 35 to 54. Half again on both, not twice: part of every step is overhead that bandwidth does not shrink, and the faster the bus, the larger that part's share. How large depends on the kernel the engine picks for the model, and that showed when a fourth family was measured on the same two cards: twice the bandwidth bought 26 percent on this model, 20 to 58 percent on a dense 31B, and nothing on a mixture of experts whose wide attention heads forced both cards onto the same slow kernel. The card sets the ceiling; the kernel decides how close a model gets, and the engine's startup log names the kernel it chose. So: the card sets the latency ceiling. Throughput is a different question, and one request answers it badly, with the bus idle most of the time. The engine's knob between the two words is the batch, and that is the next step.", "The picture becomes a timeline: a time axis, one decode step after another from left to right; a row for the weights read and a row for one request; two counters, weights read per step and tokens produced per step, both at one. Nothing moves yet."]}, {"name": "Batching", "src": "media/videos/s03_batching/1080p60/Batching.mp4", "ends": [2.798, 4.898, 6.398, 11.881, 26.414, 29.714, 33.981, 35.748, 37.514, 40.281, 42.181, 43.181, 44.981], "notes": ["Here is decode as a timeline. Each violet block is one step: all the weights come in from memory. Each step hands the request one token. The step is as long as the weights read, so this request gets a token every eight milliseconds or so, and the bus is busy for a fraction of that: the rest is the launches and bookkeeping from the last scene. Nothing else is using the GPU.", "Four requests: the same read of the weights serves all four; four tokens per step. Now three more requests arrive, and the engine puts their tokens into the same steps. Look at what did not change: the violet blocks. The weights come in once per step, exactly as before, and that one read now does a column of arithmetic for each of the four requests. Tokens per step went from one to four; reads per step stayed at one. That is the entire reason an engine batches: the expensive thing, moving the weights, is paid once per step no matter how many requests share the step.", "The step gets a little longer: each request adds a column of arithmetic and its cache read. The step does get a little longer, and here is the trade in one picture. Each extra request adds one column of arithmetic and one read of its own KV cache to the step; the weights read is unchanged. So the time between one request's tokens, its latency, creeps up, while the tokens the GPU produces per second, the throughput, climbs almost in proportion to the batch. That holds until the added arithmetic or the added cache reads grow to the size of the weights read, which is where the curve you are about to see bends.", "Requests never arrive together. Light load: two or three share each read, the GPU mostly waiting. The timeline assumed four requests that arrived together. They never do: requests come and go on their own clocks, so the engine re-forms the batch at every step from whoever is in flight. Watch it run. Eight slots drawn, the most requests the engine will put into one step; the real setting is max_num_seqs, 256 in our engine. Time scrolls left; every step enters at the right as a column, a violet block for the weights read and one cell per slot. A request is a colour: it arrives in the queue at the bottom, takes a free slot, its first cell is its prefill, then one token per step until it is done. At light load two or three requests share a step and the rest of the column is hollow: the weights were read, and nothing came out for those rows. The bus gauge sits where the single request left it, the compute gauge is near the floor, and the tokens per second counter says what that costs. This GPU is mostly waiting.", "Heavy load: every slot full, a queue forms, the step a little longer, four times the tokens per second. Then arrivals come faster than requests finish. Slots fill. A request that finishes frees its slot, and the next one waiting takes it at the very next step; nobody waits for a batch to drain. That is continuous batching: the batch re-formed every step. When all eight slots are taken, arrivals wait in the queue, and that queue is the dashboard's saturation signal. Look at what the load did to the machine. The columns are wider: the step is longer, because eight columns of arithmetic and eight cache reads ride on each weights read. But it is not eight times longer; it is about twice, and that is measured. So eight tokens a step for twice the step: four times the tokens per second, the compute gauge up, the bus gauge higher because the cache reads add bytes. When arrivals slow, it runs in reverse: slots empty, hollow cells return, the counters fall. The measured curve next is this picture with numbers.", "Now measured, on this GPU: each request's speed and the total, as the batch grows. Now the same thing measured. The GPU from before with one request decoding: the bus busy about forty percent of the time, the compute grid nearly idle, and three counters: requests in flight, tokens per second each one gets, and tokens per second from the whole GPU. Both are measured while decoding, so with one request they are the same number: this is the latency and the throughput from the last scene, side by side. Both count tokens produced; the bus gauge is what counts bytes read.", "Eight in flight. Each request slowed from 174 to 86 tokens per second, half; the GPU went from 174 to nearly 700, four times. The step grew from 5.7 to 11.6 milliseconds: eight columns of arithmetic and eight cache reads on one weights read. That is the trade in numbers: latency doubled, throughput quadrupled.", "Thirty-two. Each request at 56 tokens per second, the GPU near 1,800. The memory controller is now busy 76 percent of the time, the compute grid filling. Both gauges rising together is the sign that the batch is doing what it should.", "Sixty-four. Each request at 48, the GPU past 3,000, and the curve bends: the added arithmetic and the added cache reads now weigh about as much as the weights read, so each new request costs the others more than it did.", "One hundred and twenty-eight. Each request at 41 tokens per second, the GPU above 5,000. The bus gauge is where it was at 32: 77 percent busy is as hard as this kernel stack drives the memory controller. For the record, the wall-clock totals we measured were 166 at one in flight and 4,971 at 128; the same picture with prefill and the gaps between requests included.", "What stops the batch growing forever is the teal segment. Every request in flight keeps its KV cache in memory, and that memory is whatever the weights left over. When it fills, the engine preempts: it evicts a request's cache and recomputes it later. That recompute is prefill work done twice, pure waste, and it shows up on a dashboard as a latency spike. So the number of requests a GPU can serve is set by the memory left after the weights.", "Which sets up the first thing anyone does when they host a model: make the weights smaller. Smaller weights mean fewer bytes per decode step, so faster tokens, and more memory left for cache, so a bigger batch. Both gauges move in the right direction at once.", "The picture hands over. this talk's model: a 30B mixture of experts, 3B active per token, on the 96 GB card. The 30B model as it ships, in 16-bit: 30 billion weights at two bytes each is 57 GB, and every decode step reads what a token needs from them. On the 96 GB card that leaves about 30 GB for the cache. Read the middle number carefully: 330,000 tokens of context is the whole cache, shared by every request in flight; at 96 kilobytes per token that is about forty conversations of 8,000 tokens, or one request at the model's full 262,000-token context. The cache, not the weights, is what limits how many requests fit. The bottom number is prefill work, prompt tokens per second, the measured throughput of one GPU inside an eight-second latency budget."]}, {"name": "Quantisation", "src": "media/videos/s04_knobs/1080p60/Quantisation.mp4", "ends": [4.2, 5.7, 7.5], "notes": ["Store each weight in one byte instead of two. Every decode step now reads 29 GB instead of 57, so the bandwidth-bound loop runs nearly twice as fast, and the cache has about 58 GB instead of 30, so twice as many tokens of context fit, about 630,000. Both gauges of the talk move at once. The bottom number is the one to read carefully: prefill doubled too, 7,900 to 16,200 prompt tokens per second per GPU, and that is not the bytes. Prefill is compute-bound, and this GPU generation multiplies fp8 numbers at twice its bf16 rate, so fp8 buys the two phases through two different mechanisms: half the bytes for decode, twice the arithmetic for prefill. Prefill has a ceiling of its own, the mirror of the division in move one: the card's arithmetic rate over twice the active parameters, about 250 trillion operations per second on this card at bf16 and roughly twice that at fp8. A dense 31B measured 4,300 and 8,100 prompt tokens per second, right on it. Twice the work per GPU is half the fleet for the same traffic. One config line.", "The KV cache is a second, independent decision. Its entries can be stored in fp8 as well, which halves the bytes per cached token, 48 kilobytes instead of 96 for this model, so the same 58 GB holds about 1.27 million tokens; that last figure is what the engine reported at start on this card, the other two follow from the same arithmetic. On this GPU's attention kernels the fp8 cache also measured 12 percent faster decode. The two knobs are set separately and the right answer for one does not follow from the other: on H100s an fp8 cache can narrow the engine's choice of attention kernel to a slower one; for one model family the bf16 cache got the faster kernel and ran 28 to 69 percent faster on long prompts. The startup log names the kernel it chose; read it before trusting either setting. One more thing about the 96 kilobytes: it is this model's number, not the card's. Bytes of cache per token are set by the model's layers, its key-value heads and their width, and across the families measured they vary six-fold: 33 kilobytes per token for one 26B mixture of experts, 186 for a dense 31B, whose 262,000-token context needs 33 GB of cache for a single request. The cache decides how many requests fit, and the model decides the cache. The obvious question is what all this did to the answers. It gets its own move, five, because the answer has a mechanism worth seeing and a measurement worth trusting. The short version: fp8 costs nothing we could measure on any task; 4-bit costs a little, always. Hold the question until then.", "The picture hands over. The still picture: a dense model as a stack of six layers, each layer one solid block of weights, and a counter for the bytes a token reads on its way down: 32 GB, all of it. Nothing moves yet; the next click sends one token through."]}, {"name": "MixtureOfExperts", "src": "media/videos/s04_knobs/1080p60/MixtureOfExperts.mp4", "ends": [4.35, 10.7, 11.2, 14.198, 15.798], "notes": ["A dense model reads all of itself for every token: the token passes down through every layer and every layer is read in full. A 32B model in fp8 is 32 GB per token, per decode step, whatever the token is about.", "mixture of experts, 30B parameters: each layer holds 128 experts, a router picks 8, so 3B are read (drawn as 8 experts with 2 chosen). A mixture of experts splits each layer's big feed-forward matrices into several smaller ones, the experts, and a router sends each token to a few of them; drawn here as eight experts with two chosen, where the real 30B model has 128 per layer and routes eight. The token still passes down through every layer, but in each layer only two of eight experts light up. The 30B model has 3B active parameters: a token touches 3 GB of weights, not 30. Since decode is bound by bytes read, that is a tenfold cut in the thing that costs. A 30B mixture of experts decodes like a 3B model and answers like a 30B one.", "same layers, same depth; a tenth of the bytes per token, so ten times the decode ceiling. So the two knobs so far both attack bytes per token: quantisation shrinks every weight, a mixture of experts reads fewer of them. Same depth, same stack of layers, a tenth of the bytes, ten times the decode ceiling from the last scene. That is why this talk's model is one. A second family repeated it: a 26B mixture of experts with 3.8B active served five times the requests of its dense 31B sibling, and a dense 12B, a smaller model in total, was slower than it at every load. Active parameters set the speed; total parameters only cost memory. Now the catch.", "the catch: a batch of eight tokens picks seven of eight experts; under load most of the model is read anyway. The catch is the batch. Remember, the engine decodes many requests in one step. Eight tokens each pick their own two experts, and together they pick most of them: seven of eight per layer here, and the counter shows it. The step now reads eleven of the thirty gigabytes in the drawing, not three. On the real model, with 128 experts and eight chosen per token, a batch of 128 touches nearly all of them, and we measured it on the memory bus: at one request the memory controller is busy 39 percent of the time and the step reads about the active 3 GB; at 128 in flight it is busy 77 percent of the time and the step reads essentially all 29 GB. The mixture-of-experts advantage is large at low concurrency and shrinks as the batch grows. Size a fleet on the loaded number, never the batch-of-one number. Two knobs so far, both about bytes per step. The third is about not reading at all.", "The picture hands over. The still picture: the first turn of a conversation, six prompt tokens in blue and three answer tokens in yellow, and a counter of tokens prefilled, nine. Where the attention state of those nine tokens went is the next click."]}, {"name": "PrefixCache", "src": "media/videos/s04_knobs/1080p60/PrefixCache.mp4", "ends": [0.9, 1.9, 3.9, 6.4, 10.7, 13.5, 19.05, 20.65], "notes": ["The first turn of a conversation: six prompt tokens, three answer tokens. Prefill read nine tokens and left their attention state in the cache, stored in fixed-size blocks and tagged by the tokens they hold.", "Turn two arrives carrying turn one inside it: the chat client resends the whole conversation plus the new question. Without help, prefill reads all thirteen tokens again. Nine of them the engine has already seen.", "prefix caching: blocks whose tokens match are reused; only the new tokens are prefilled. Prefix caching hashes the incoming tokens block by block and matches them against blocks already in the cache. Nine tokens match, so prefill computes four. On a long conversation, a shared system prompt or a document that many users ask about, this removes most of the prefill work. It is on by default and costs about one percent when nothing matches. Measured with every prompt cached: plus 46 percent on short prompts, 2.7 times on 4,000-token ones.", "at scale: many engines, each with its own cache. Which engine gets the next turn?. Now the fleet. Eight engines, each with its own cache: the blocks of a conversation live in the engine that served its first turn, engine three here. The load balancer's job is to spread requests evenly. Those two facts collide.", "Round robin sends each turn to the next engine in line, so a conversation's second turn finds its blocks about one time in eight, and the fraction falls as the fleet grows. Measured on eight engines with six-turn conversations: 21 percent of turns hit their cache. Most of the prefill work that caching should have saved was done again, on the wrong engine.", "The fix is not in the engine. A load balancer cookie pins each client's conversation to the engine that holds its blocks. Same engines, same cache, same model: 75 percent of turns hit, and the fleet served 14 percent more requests per second at lower latency. The lesson generalises: prefix caching is a routing decision. The engine can only reuse what it is sent.", "a shared store (LMCache, Mooncake, Dynamo KVBM): a long document many users ask about, an agent's context between tool calls. The other way out attacks a different limit: the cache is small and blocks are evicted long before a conversation is over, so even the home engine forgets. Three engines fill up here and spill blocks; a turn that comes home gets its block back from host RAM, and a turn that lands on a far engine can still find a copy in a store every engine can read. What lives in such a store: a long document many users ask about, a system prompt shared by a product, an agent's context while it waits on a tool. The projects that build them are LMCache, Mooncake and NVIDIA's Dynamo KVBM, all speaking the engine's connector interface. The engine's blocks are content-addressed, tagged by the hash of the tokens they hold, and a connector can copy a block out when it is evicted and look for it there on a miss. The cheap tier is the host's own RAM, copied over PCIe; the tier behind that is a shared store on the network, which any engine can read. We measured the first on this stack, and the result is the lesson. A 32 GB host tier behind a 58 GB GPU cache, with conversations whose working set was 1.4 times the cache: the tier absorbed 590 GB of evicted blocks in four minutes and served zero hits, because every block was overwritten before its conversation came back; throughput and latency within 1.5 percent of having no tier. Shrink the GPU cache so that the tier is nine times larger than it, and 79 percent of prompt tokens come back from host memory. The mechanism works; the ratio decides. A tier smaller than the churn is pure cost, and a tier is one engine's own: a turn routed to another engine cannot see it. So the knob has two parts. Routing decides whether a request reaches the blocks it could reuse; a second tier decides whether they still exist, and only when it is sized to the working set that will come back. Read the hit counters the engine publishes before paying for either. One caveat for the operators in the room: the cookie pins a client, not a user. Behind an API gateway that holds one cookie jar, stickiness would pin the whole gateway to one engine. Turn it on only when clients keep a cookie per end-user conversation, or have the gateway replay it per session; or use a router that looks at the prefix itself, which move seven comes back to.", "The picture hands over. Back to one engine and one answer. At the top, the prompt as five tokens; under it the target model, the model being served, as one wide box, because every pass through it reads all of its weights; under the box, the row where a pass puts what it predicts. Two counters, passes of the model and tokens written, and the two gauges, bus and compute. The three knobs so far changed what a step reads or what a request brings with it. The fourth changes how many tokens one step writes."]}, {"name": "Speculative", "src": "media/videos/s04b_speculative/1080p60/Speculative.mp4", "ends": [4.75, 10.966, 15.866, 18.566, 26.266, 37.014, 39.114, 43.664, 45.364, 47.064, 48.664], "notes": ["One fact from move one carries this whole knob. Inside the target a pass is drawn by its attention pattern: one row per position it computes, and each row covers the tokens up to its own, because a position may only look at itself and what came before. That is the triangle from move one, and all five rows lit at once, because the pass computes them together, as one matrix multiplication. Every row predicts the token after it, and the prediction sits just right of the row's end, under the slot it predicts: after 'The' the model predicts 'cat', which is already there, after 'cat' 'sat', and so on. Four predictions only repeat the prompt and are thrown away. The last row's is new, 'mat', and it rises into its slot as the first token of the answer.", "Decode. The text slides left so the newest token always sits in the same place. Now a pass computes one position, the newest token, so the triangle is a single row. It still covers every earlier token, in the cache colour: their keys and values are read from the cache, not computed again. One row, one token written, and every pass still reads all the weights: the bus gauge full, the compute gauge nearly empty. This is the latency ceiling from move two, bandwidth over bytes per token, and batching cannot raise it for one request: batching fills the idle arithmetic with other requests' rows. To go faster, one request would need more rows per pass, positions of its own that do not exist yet, because each token depends on the one before it.", "So make the positions up. A draft is a small model, often one to four layers riding on the target's own features, and it writes a candidate sequence: four tokens, 'slept in the sun'. It writes them one after another, like any model decodes, but each of its passes reads a small fraction of the bytes a target pass reads, so the four cost a fraction of one target pass. It is one continuation, not four alternatives, and nothing is written yet: they are guesses.", "Now the target runs one pass over the newest real token and the four guesses: five rows, lit at once, exactly as prefill computed the prompt. Look at the right end of each row: the rows below the first contain guesses, the draft-coloured cells, because each position sees everything before it, guesses included. So each row's prediction is what the target would write if the text up to there were true: after 'It', 'slept'; after 'slept', 'in'; after 'in', 'the'; after 'the', 'warm'; and a fifth after 'sun'. One read of the weights, the bus gauge where it was, and the compute gauge up: five rows of arithmetic on units that were idle.", "The check, left to right. The first row's prediction rises up its column to the first guess: 'slept' and 'slept', kept. 'in', kept. 'the', kept. The fourth row predicts 'warm' where the draft guessed 'sun': the first miss. Now the triangle shows what else goes. The column of 'sun' turns red in every row that contains it, and the last row does: its prediction was made after a wrong guess, so it is void. Everything after the first miss is thrown away for that reason, and the target's own 'warm' takes the slot. Four tokens from one pass where decode wrote one, and every kept token is the target's own prediction, so the text is exactly what the target alone would have written. With sampling instead of greedy picks the rule is a coin: a guess is kept with the probability of the target's over the draft's for that token, and a rejected slot is filled from the difference of the two, which leaves the output distribution exactly the target's (Leviathan, and Chen, 2023). The kept tokens' keys and values stay in the cache; nothing is computed twice.", "Three more rounds at speed. All four guesses right: five tokens, the fifth a bonus, the last row's prediction. The first guess wrong: its column is red in four of the five rows, one token is written, the same as plain decode, and the draft's work is wasted. Three right: four tokens. A pass writes at least one token and at most one more than was drafted. What matters is the average, and the engine logs it as the mean acceptance length, counted with the target's own token: 3.1 tokens per pass for Gemma 4 12B with its four-guess drafter, 2.2 for an EAGLE-3 draft of three on the 30B model of this talk. Seventeen tokens in seven passes here.", "Every method draws the same check; they differ in where the guesses come from. N-gram, or prompt lookup, copies what followed the last few tokens where they appeared earlier in the text: free, and right only when the answer quotes the prompt, as in summaries, code edits and extraction. On open-ended answers under load it measured 58 percent slower here: almost nothing was accepted, the verification was paid anyway, and turning it on switched off the engine's asynchronous scheduling. A draft model is a small separate network with the same vocabulary; EAGLE-3 is one trained on the target's own internal features, which is what makes it accurate, and a publisher ships it next to the model. Multi-token prediction, MTP, is draft layers built with the model: DeepSeek V3 and Qwen3-Next have them inside the checkpoint, and each Gemma 4 size has a four-layer drafter that reads the target's own cache instead of keeping one. Around these sit variants that verify a tree of guesses in one pass, draft from the model's own early layers, or draft a whole block at once. The better the guesses and the cheaper they are, the more each pass writes.", "Now the cost, and it is the compute the verification takes. A dense 12B in fp8 with its publisher's four-layer drafter, against the same engine without it, unique 1,000-token prompts: one request in flight, twice the requests per second, 176 against 86 tokens per second; eight in flight, plus 88 percent; then 79, 54 and 32 percent at 64. The gain falls as the batch grows because a batch already uses the arithmetic that was idle for one request, so the extra positions stop being free. It never went negative on this model: its prefill wall is far above what 64 users ask of it, and a drafter that shares the target's cache is cheap. The 26B mixture of experts with its drafter kept plus 51 percent at 64.", "A different model and draft: the 120B mixture of experts with its publisher's EAGLE-3 draft, always three guesses, measured on eight engines and read per engine. Plus 44 and 47 percent at 8 and 16 in flight per engine, plus 8 at 32, and minus 27 percent at 64: a loss. With many unique prompts in flight, prefill needs the compute, and three guesses per request per step, many of them rejected, take it away. Speculation trades arithmetic for fewer passes, and that is only a good trade while arithmetic is spare.", "So draft less as the batch grows. The engine takes a schedule of draft lengths by the number of running requests; here three guesses up to 16, one up to 32, none above. The same model on one engine: plus 23, 27 and 17 percent where it drafts, and minus 6 at 64, inside the noise, where the fixed length lost 27. One configuration then holds across the day. Two practical points. The draft is specific to its target: change the model and the draft must change with it. And the first time the engine meets a new draft length at a new batch size it compiles for about thirty seconds, so warm every level you will serve before taking traffic. Where decode is the wall, this is the knob to turn on first.", "The picture hands over. 236 GB of weights and no GPU that holds them: divide the model, and pay at the seams. Some models do not fit one card. A 235B mixture of experts in fp8 is 236 GB of weights; the largest single GPU we can rent holds 96. So the model has to be divided over several GPUs, and how it is divided shows up as time."]}, {"name": "Parallelism", "src": "media/videos/s05_parallelism/1080p60/Parallelism.mp4", "ends": [8.1, 9.6, 11.4, 16.5, 20.0, 21.0, 22.6], "notes": ["Tensor parallelism: the whole vector to every GPU, a quarter of every matrix each, then exchange. Tensor parallelism is what engines do inside a machine: instead of splitting the stack of layers, split every matrix. Each GPU holds a quarter of every weight matrix in every layer, so all four GPUs work on every token at once. The same whole vector arrives on every GPU; each multiplies it by its own quarter of the matrix, a quarter of the arithmetic in parallel, and what each GPU holds afterwards is a quarter of the answer: partial sums for every output number. Then comes the seam. The four have to be added together, so every GPU sends its partial sums to the other three and receives theirs, the red arrows, an all-reduce. Only after it does any GPU hold the layer's real output. In a real block this exchange comes once per pair of matrices: the first is split so each GPU keeps a slice of the intermediate result and needs no exchange, the second turns those slices into partial sums and needs the all-reduce; two per layer. Every layer of every token waits on it, and it needs a fast link between the GPUs, which is why this stays inside a node. The other way to divide a model, whole layers per GPU with the token walking from one GPU to the next, exists and is how a model is spread across machines; it exchanges almost nothing but leaves GPUs idle in turn, and it is not what you meet inside a single box. On the timeline: each GPU's share of the step, the weights it reads and the arithmetic it does, shrinks to a quarter; the red part is the exchange, and over the PCIe links inside this box it takes about as long as what the split saved.", "Go to eight GPUs and each GPU's share halves again while the exchange grows: one more participant in every all-reduce. Over PCIe, the link inside a g7e, the exchange costs about what the split saved. Measured on this talk's model: a second GPU at tensor parallel two added nothing to prefill, 22,700 to 21,700 prompt tokens per second, while the same GPU as an independent engine added 43 percent; at tensor parallel four the model reached a lower fraction of its bandwidth ceiling than on one GPU. This is the third wall of the talk, after compute and bandwidth: lockstep. Over a slow link, tensor parallelism is a way to make a model fit, and nothing more.", "Now the same split over a fast link. NVLink moves the partial sums in a fraction of the time PCIe takes, so the red segments shrink and the split step is shorter than the one-GPU step. That is the spine again: a dense decode step streams every weight, and a quarter of the weights per GPU is a quarter of the bytes on each GPU's bus. Measured on eight H100s with a dense 31B in fp8: one request decoded at 64 tokens per second on one GPU, 97 on two, 134 on four. And with 64 requests in flight across the host, two engines at tensor parallel four served 34 percent more than eight independent engines; at 128, 26 percent more. Then the knee: at 512 in flight they served 12 percent less. The exchange carries every token's activations, so it grows with the batch, while the saving on the weights read is the same at any batch size; past about 32 requests per GPU, eight independent batches win. So the rule has a shape. Below the knee on a fast link, splitting a dense model buys latency and throughput; above it, and on any PCIe box, one engine per GPU. The mixture-of-experts case was not measured over NVLink.", "measured here, 235B on 8 GPUs: per request 108 tokens/s without, 86 with; under load 7 to 20% fewer requests/s. the model is too big for tensor slicing alone: hundreds of experts spread whole across many GPUs. Expert parallelism is the other way to place a mixture of experts: instead of slicing every matrix across the GPUs, whole experts are placed on GPUs, and each token travels to the GPUs that hold the experts its router picked. That replaces the all-reduce with an all-to-all of tokens. When is that the right layout? When the model is so large that slicing alone cannot place it, hundreds of experts across dozens of GPUs, the frontier models of six hundred billion parameters and more; and when the batch is large enough that every GPU's experts have tokens to serve on every step, otherwise GPUs sit idle waiting for tokens that never come. Our measurement is the small end of that: a 235B model on eight GPUs. One request decoded at 108 tokens per second with tensor parallelism and 86 with expert parallelism, and under load it served 7 to 20 percent fewer requests per second, because at this size the all-to-all costs more than the all-reduce it replaces. One practical reason to turn it on anyway: some fp8 checkpoints refuse a tensor split that would cut an expert's 128-wide tiles, and this one would not start at tensor parallel eight without it. It is one flag and one restart; measure it rather than assume it.", "Here is the decision that matters on an eight-GPU host. One engine at tensor parallel eight is the obvious layout: every GPU works on every request. Its step timeline is compute, sync, compute, sync.", "The alternative: two independent engines, each at tensor parallel four, behind the load balancer. Each does more arithmetic per step and synchronises across four GPUs instead of eight, and the two never wait for each other. Same model, same hardware, same load, 512 requests in flight, far above the knee: 22.5 requests per second against 13.4. Sixty-eight percent more work from the same eight GPUs, by dividing them differently. The rule that falls out: use the smallest tensor-parallel degree at which the model fits, and spend the rest of the GPUs on more engines; the one exception is the last click's, a dense model on a fast link below the knee. One practical trap: block-quantised fp8 checkpoints refuse degrees that would split an expert's 128-wide tiles, so this 235B model would not start at TP=8 without expert parallelism. The engine tells you; the docs record which combinations ran.", "The picture hands over. The still picture: a weight matrix, sixty-four cells here where a real one has millions, each cell a number stored in sixteen bits. Move one made these smaller. The next click picks one cell out."]}, {"name": "Rounding", "src": "media/videos/s06_quality/1080p60/Rounding.mp4", "ends": [1.4, 5.2, 6.7, 9.1, 10.7], "notes": ["Move one made the weights smaller and the fleet half the size. Now the question everyone held: what did that do to the answers? Start from what a weight is: a number, one of billions, stored in sixteen bits. Take one of them, 0.7342. Quantisation stores it in fewer bits, and fewer bits means fewer values it is allowed to take.", "Three precisions, one weight. In sixteen bits the allowed values are so dense, tens of thousands on this stretch, that the weight barely moves. In eight bits there are 128 levels on this stretch and it moves by two ten-thousandths. In four bits there are eight levels, and it moves by 0.016, two percent of its value. Real formats are smarter than this picture: they fit a scale to each small block of weights so the levels cover that block's range, and fp8 spaces its levels unevenly; the picture is the same. Fewer bits, coarser levels, larger rounding error per weight.", "Every weight moves a little, up or down; every score the model computes moves a little. Now every weight in the matrix has done the same, each by its own small amount, some up, some down. A layer's output is a sum over thousands of these, so the errors partly cancel and partly do not: each output number is a little off, and after a hundred layers every score at the bottom, every next-token probability, has moved by a small random amount. That is the whole effect. What it does to an answer depends on how close the decision was.", "Where the model was sure, nothing changes. Where it was nearly undecided, the choice flips. Two positions in an answer. Left, the model is sure: one token far ahead, the shift moves the bars a little and the pick, the marker, stays. Right, a close call: two tokens nearly tied, the same small shift and the pick flips. So quantisation does not degrade every answer a little. It leaves the sure ones alone and re-decides the close ones, and one re-decided token early in an answer can send the rest of it elsewhere. The cost is a flip rate on the hard items, and it is exactly the kind of thing that must be measured rather than reasoned about. Which sets the terms for the next two scenes. We will score the same items on two deployments and count flips. But close calls flip for other reasons too: a different batch, a different summation order in a kernel. So before crediting any flip to precision we need to know how many flip when nothing changed at all.", "The picture hands over. 100 questions from a standard benchmark, each dot one question, scored right or wrong. One hundred items from a standard benchmark, each scored pass or fail, on a bf16 deployment. Now deploy the same model with the same settings a second time and score the same hundred items again. Nothing about the weights has changed."]}, {"name": "NoiseFloor", "src": "media/videos/s06_quality/1080p60/NoiseFloor.mp4", "ends": [2.7, 4.3], "notes": ["the same model deployed twice: 3 of 100 answers changed, 2 to right, 1 to wrong. Three of a hundred change anyway. The close calls from the last scene flip on their own: a different batch composition changes a kernel's summation order, a near-tie breaks the other way, and a multi-step task ends somewhere else. How many flip depends on the task, and we measured it: about 3 percent on tool-calling tests, 2 on structured extraction, 12 on coding fixes, 27 on long agent tasks, where one different token early sends the whole trajectory elsewhere. This is the flip rate of nothing. So the rule for reading everything that follows. A difference smaller than the repeat spread is not a result. Per-item flips only mean something when gains and losses are unbalanced. And a baseline has to be run twice before it can be compared with anything; we did, for exactly this reason.", "The picture hands over. The still picture: the same hundred questions as the last scene, every dot grey, no answer changed yet. Each click from here compares one precision against the same model in bf16."]}, {"name": "PrecisionCost", "src": "media/videos/s06_quality/1080p60/PrecisionCost.mp4", "ends": [1.7, 3.8, 5.9, 7.5], "notes": ["fp8 against bf16. Across four model families and several thousand items per task, about 4 percent of items change, and the gains equal the losses: on one 32B model, 84 items got better and 84 got worse. That is the noise floor from the last scene. It held on the standard question suites, on structured extraction, on tool calling, on coding fixes and on agent tasks: every aggregate inside the repeat spread, every flip balanced. Half the bytes per weight, the fleet halved, and no cost in answers that we could measure. This is why fp8 is the default and not a trade-off.", "Calibrated 4-bit: 6 to 10 of 100 change, 4 to wrong for every 3 to right. Four-bit weights are the first precision with a consistent cost, and it is the coarse levels from the rounding picture showing up. Six to ten percent of items change and the losses outnumber the gains about four to three: plus 123 and minus 163 for one format, plus 114 and minus 167 for another, on the same model. In aggregates that is half a point to two points on the standard suite, 3 to 5 percent worse perplexity, about a point on tool calling. Small, real, and the same for every 4-bit format we tried. Even a publisher's own quantisation-aware 4-bit, a model trained to be rounded, paid the same on a fourth family: half a point to two, one answer in twelve to twenty flipped. The format does not matter; the number of levels does.", "One community 4-bit build: 18 of 100 change, 3 to wrong for every 1 to right. One more, because it changes what you have to do. A 4-bit format has a scale per block of weights, fitted on a sample of text, and where the sample does not resemble the traffic the rounding errors land on the wrong weights. One community build of a coding model scored within a point of bf16 on extraction and on simple function calls, so on a chat leaderboard it looked fine. On multi-step tool use it lost 27 points of the ability to decline a tool call it should not make, and it resolved seven coding tasks where bf16 resolved 22. Eighteen percent of items flipped, three losses per gain. The same format from a publisher who calibrated it cost one point. The format is not the risk; the build is, and only a measurement on the task you will run tells them apart. Three habits, then. Score the checkpoint you will deploy, under the settings you will serve it with. Compare it with your own bf16 run, not with a published number. And score the task your traffic is, not a proxy: the broken build passed every proxy and failed the real work.", "The picture hands over. A fleet starts from one engine's measured rate, at your latency budget and prompt shape. Everything before this was one engine, and a fleet is built from one number about it: how many requests per second one engine sustains inside your latency budget, at your prompt shape. That number is the operating point on the batching curve from move two, and nothing about it can be looked up; it moves with the model, the prompt length and the budget. In our measurements it is about 16 requests per second, 16,000 input tokens per second, for 1,000-token prompts inside an 8-second p95. Take that as the worked example, not as a constant."]}, {"name": "Fleet", "src": "media/videos/s07_fleet/1080p60/Fleet.mp4", "ends": [2.5, 5.567, 10.567, 13.067, 14.567, 16.167], "notes": ["Requests are independent, so engines add up: two engines serve twice what one does, to within a percent or two, as long as the balancer spreads the load. That makes sizing arithmetic. Peak demand divided by one engine's rate, with some headroom for bursts and for the engine you will lose to a reclaim or a restart, rounded up. In the example: a hundred requests per second over sixteen with fifteen percent headroom is eight engines. The exception is multi-turn traffic, whose cache hits depend on routing, which knob three covered.", "The shape that follows: several independent engines behind a balancer, rather than one large engine over many GPUs. Move four gave the throughput reason, replicas over parallelism past the degree where the model fits. There are two operational reasons too. A failure or a spot reclaim takes one engine out of eight, not the whole service. And capacity comes in engine-sized steps, so the fleet can follow demand more closely. What sits in front of the balancer, TLS, keys, rate limits, is ordinary web infrastructure and not this talk's subject.", "Adding an engine means loading the model: minutes. Size for the peak, autoscale for the trend. Autoscaling is slower than people expect, for a reason that is not about any one stack. A new engine has to notice the load, get a machine with a GPU, pull an image, and load tens of gigabytes of weights before it answers its first request; every stage is minutes, not seconds. In our stack the whole chain measured eleven minutes from alarm to serving, and scale-in is slower still. So the fixed fleet is sized for the peak from the arithmetic above, and autoscaling is insurance against a trend that lasts longer than a coffee break, not a way to meet a burst.", "When the fleet is slow, the balancer can only tell you that it is: request counts and response times. Why lives inside the engines, and every engine publishes it: how many requests are waiting for a place in the batch, how full the KV cache is, how many requests were preempted. Read them against the pictures from moves two and three. A queue that is never empty is saturation. A cache near full means preemptions next. Any preemption means work done twice. Scrape these into whatever dashboard you have; the balancer's numbers alone cannot tell the three apart.", "One last shape change, because most new traffic is agents. An agent sends the model a list of tools and expects a structured call back, so the engine needs a parser for that model's tool-call format, or the call comes back as plain text and the agent stalls without an error. Agent steps carry the whole trajectory, tens of thousands of tokens on a busy engine, so they run long, longer than the timeouts most proxies and gateways apply to a request that has not started answering. Stream them. And if the model thinks, size the answer cap for its chain of thought: with thinking on and a small cap, every answer was cut off inside the thought, the fleet looked healthy on every graph and answered nothing; a tool call that cost 23 tokens with thinking off cost over a hundred with it on. None of this changes the machine; it changes what the machine is asked to hold.", "The picture hands over. vLLM, SGLang, TensorRT-LLM: different code, the same shape. A prefill phase, a decode loop, a scheduler that decides which requests share each step. The frontier is not a new shape; it is a list of attacks on the two costs we started with. Here are the six that matter this year, placed on the part of the pipeline they attack."]}, {"name": "Industry", "src": "media/videos/s08_industry/1080p60/Industry.mp4", "ends": [1.1, 1.6, 2.1, 2.6, 3.6, 5.2], "notes": ["Disaggregated serving pulls the two phases onto different pools of GPUs: prefill on hardware and settings chosen for compute, decode on hardware and settings chosen for bandwidth, with the KV cache handed across between them. It is the logical end of the two-gauge picture, and the orchestration layers built for large fleets, NVIDIA Dynamo and llm-d among them, are organised around it. Be precise about what it buys: the engine projects say it does not raise throughput per GPU by itself; it lets time-to-first-token and time-per-token be tuned independently and stops a long prefill from stalling everyone's decode. For a homogeneous single-GPU fleet at moderate prompt lengths the transfer costs more than it saves, which is why our stack does not do it.", "The cache stops being one engine's private memory. Routers that score engines by the blocks they hold and the depth of their queue are now standard parts of the fleet layer, the grown-up version of the session cookie from knob three, and the vendors report time-to-first-token roughly halved on conversational traffic. Behind them, tiers: the engines now ship frameworks that spill evicted blocks to host memory, local disk, object stores and other nodes, and pull them back on a hit. Knob three's measurement is the caution to carry into that world: a tier pays only when it is sized to the working set that comes back.", "The third front on this side attacks the read that grew with every token in move one. Sparse attention lets a token score a selected subset of the cached keys instead of all of them, and the newest large models ship with it built in; the engines have separate prefill and decode paths for it. If it holds up in quality, the cache read stops being the thing that fills the bus at long context, and long conversations get much cheaper to hold.", "Speculative decoding is a knob now, knob four, and its frontier is the draft itself. Knob four drew the draft guessing one token after another, and for a long draft that loop becomes the cost it was meant to hide. The newest drafters propose the whole block in one pass: P-EAGLE makes an EAGLE-3 draft parallel and reports 10 to 36 percent over EAGLE-3 in vLLM; DFlash drafts with a small block-diffusion model and reports up to two and a half times EAGLE-3. Both are options in the engine today; we have not measured them. A longer draft still pays only under knob four's two conditions: the guesses must be accepted, and the arithmetic to verify them must be spare.", "Two more on the decode side. Four-bit weights are two different products. A weight-only kernel unpacks int4 to bf16 and multiplies at the bf16 rate: half the bytes again, so one request decoded 48 to 58 percent faster than in fp8, and prefill fell back to the bf16 rate, half of fp8's. Blackwell GPUs also compute in four-bit floating point natively, with a scale per block of sixteen values, so NVFP4 keeps fp8's arithmetic rate and cuts the bytes: another 25 percent here on one dense model, and nothing over fp8 on a mixture of experts with narrow experts. So pick a 4-bit checkpoint by the wall you are at and by the kernel the startup log names, not by the bit count; what the two cost in answers was the same, the half point to two from move five, calibrated build or not. And reasoning models turn the number of tokens per answer into a knob, effort, which changes capacity by 1.7 to 3.8 times, more than any flag on the engine. Back to the spine: a model reads your prompt once and then writes one token at a time, and every item on this slide is an attack on one of those two costs.", "The picture hands over. The fronts fade and the two phases shrink to the top: six things to take home, each a measurement rather than an opinion."]}, {"name": "Close", "src": "media/videos/s08_industry/1080p60/Close.mp4", "ends": [3.0, 4.4], "notes": ["Six things to take home, each of them a measurement rather than an opinion.", "Every number in this talk is in the repository, with the conditions it was measured under. The repository has the stack, the measurements as data, and the tuning document that explains each one. Nothing here needs to be believed; all of it can be re-run."]}], "steps": [{"scene": "Mechanics", "si": 0, "k": 0, "note": "This talk is for engineers who will host a model, or buy hosting, and want to know what they are paying for. No product, no vendor; one stack we built to measure things, and the numbers it produced. One sentence carries the whole talk: a model reads your prompt once, then writes one token at a time, and every hosting decision is about which of those two you are paying for. Seven moves: two jobs and their costs, why the engine batches, four knobs, more than one GPU, what precision costs in answers, the fleet, and where the industry is. Start from actual text: a prompt someone typed. Five words. We follow them through the machine and out the other side, on one picture that only grows. Everything later in the talk is a consequence of what happens on this picture, so it is worth twenty minutes."}, {"scene": "Mechanics", "si": 0, "k": 1, "note": "Tokenisation. The text is cut into tokens, whole words here and pieces of words in general, and each becomes an integer from a vocabulary of thirty to two hundred thousand entries. The model never sees letters, only these integers. The two 'the's differ, capitalised and not: two entries."}, {"scene": "Mechanics", "si": 0, "k": 2, "note": "Embedding: each integer selects a row of a table; the token is now a vector of numbers. Then the lookup. The model holds a table with one row per vocabulary entry, a few thousand numbers in each row, learned like every other weight. Each integer selects its row, and that row is the token from now on: a vector, a column of numbers, drawn as eight shaded cells. Five tokens, five vectors, and the two 'the's are different rows. This is the only step where the integer matters; everything after this is arithmetic on these columns."}, {"scene": "Mechanics", "si": 0, "k": 3, "note": "The stage; everything from here on happens on it. The five vectors wait at the top. Left, the model: a stack of layers, four drawn of thirty to a hundred, each a set of weight matrices sitting in GPU memory. Right, the KV cache, empty: one column per token, one row per layer. At the edge, the two gauges the talk is about: how busy the memory bus is, moving bytes from memory into the chip, and how busy the arithmetic units are. Two counters at the bottom keep score."}, {"scene": "Mechanics", "si": 0, "k": 4, "note": "Inside one layer: the five vectors arrive together as a block, and the layer opens up. This is prefill, and we go inside it. The five vectors line up as a block, side by side, and go into layer one together. Zoom in and let the layer open up. The block arrives at the left. Everything the layer does, it does to this block: the same arithmetic on each of the five columns. Watch what that means for the weights."}, {"scene": "Mechanics", "si": 0, "k": 5, "note": "One row of the matrix, read once, multiplies all five vectors: five output numbers for one read. Three weight matrices sit in the layer, and here is the arithmetic, once, slowly. One output number is one row of the matrix against one vector: each number in the row multiplies the number beside it in the vector, the eight products are summed, and the sum is one cell of the output. Now the point of the block. The row came in from memory once, and it stays lit while all five vectors take their turn against it: five multiplications, five output numbers, one read. In a real model the row and the vector are four thousand long, not eight, and the block is every token of the prompt. Everything a layer does is this operation, repeated."}, {"scene": "Mechanics", "si": 0, "k": 6, "note": "Every row in turn: three matrices read once each give a query, a key and a value for all five tokens. Now every row, at speed, for all three matrices. Each row lights once and fills one cell in each of the five output columns. Filling the outputs touched every cell of all three matrices: to use a weight it has to come in from memory, so producing these outputs meant reading the matrices in full, once, for five columns of work. The outputs have names. The query is what a token is looking for in the tokens before it. The key is how it will answer other tokens' queries. The value is what it hands over when its key matches. Learned numbers, nothing more; the names describe the roles they end up playing."}, {"scene": "Mechanics", "si": 0, "k": 7, "note": "The keys and values are stored: this layer's row, one column per token. That is the KV cache. The keys and the values are stored in the cache, in this layer's row, one column per token, and they stay for the life of the request. That is the whole content of the KV cache: for every token, in every layer, its key and its value. Later tokens need them, and recomputing them would mean re-running every earlier token through every layer. Storing them is what makes the cache; reading them is what will make the cache expensive."}, {"scene": "Mechanics", "si": 0, "k": 8, "note": "Attention: each query is scored against the keys up to its own; the weighted values form five new vectors. Now the queries do their work. Each token's query is compared with the keys of the tokens up to and including itself, one score per pair, and the values are added up weighted by those scores. The result is a new vector for each token that carries what it needed from its context. Two things to hold on to. This is the only place tokens influence each other. And every query reads the cache row: every key, every value, for every token before it. Five cells here; sixty thousand at a long context."}, {"scene": "Mechanics", "si": 0, "k": 9, "note": "Feed-forward, most of the weights, read once for five columns of work. Then layer two, the same, at speed. Then the big multiplication. The feed-forward part holds most of the layer's weights, in a real model tens of millions of numbers per layer, and it is the same arithmetic: one row per output number, read once, used for all five columns, and the highlight has touched every cell by the time the output block is full. That is prefill's shape: the weights come in once, and every byte that arrives does five columns of arithmetic, so the arithmetic units are the busy ones and the bus has slack. The output block is five vectors of the same shape as the input, and it drops into layer two, which has its own three matrices, its own cache row and its own feed-forward, and does exactly the same thing at speed: project, store five keys and values, attend, feed-forward, hand on. Thirty to a hundred times. So one layer, one block: read all the weights once, write one cache cell per token."}, {"scene": "Mechanics", "si": 0, "k": 10, "note": "Prefill, the rest of the stack: each layer reads its weights once, for five columns of work. Back out. Two layers done, two rows of the cache filled, and the block continues down the rest of the stack at the speed it really happens: in each layer the matrices come in from memory once and are used five times, one column of arithmetic per token, so the compute gauge is the busy one and the bus is not; the small label under the gauges keeps that ratio. Each layer writes five keys and values into its cache row. The counter says what it cost: one read of the model for the whole prompt. A longer prompt costs more arithmetic, not more reads."}, {"scene": "Mechanics", "si": 0, "k": 11, "note": "The last position's output becomes a probability over the vocabulary; one token is sampled. At the bottom, the last position's vector is multiplied by one more matrix, one row per vocabulary entry, which gives a score for every token the model knows. Normalise, and it is a probability distribution; draw from it, and the answer has its first token, 'mat'. It joins the sentence. Prefill has done two things: filled the cache with the prompt, and produced one token."}, {"scene": "Mechanics", "si": 0, "k": 12, "note": "Decode: the sampled token goes back in alone, the same lookup, one vector. Decode. The sampled token goes back in, alone: the same lookup, its row of the table, one vector above layer one. Watch the gauges swap: the bus is pegged and the compute grid nearly idle. To see why, go back inside the layer with this one column."}, {"scene": "Mechanics", "si": 0, "k": 13, "note": "Decode inside the layer: the same stages, for one column. Weights read in full; cache read in full. Inside, decode is prefill for one token; nothing is skipped. The same three matrices, read in full, give this token its query, key and value, one column of arithmetic per row instead of five. Its key and value go into the cache as the sixth column of this layer's row. The label over the matrices is the point: exactly the bytes prefill read, for a fifth of the work."}, {"scene": "Mechanics", "si": 0, "k": 14, "note": "Decode: one token per step; each step reads the whole model plus every cached key and value. Then the query does its work over the whole row, six keys now, and the feed-forward sweeps in full for this one column. The output drops into layer two, which does the same at speed: project, store, attend, feed-forward. Back out, and the column goes on down the stack: in every layer the matrices are read in full again for one column of work, the query fans out over the cache row, the white lines, every stored key and value lights up as it is read, and its own key and value go in as a new column. The new counter is the size of that read. At the bottom a token is sampled and joins the sentence. One token: one full read of the model plus one full read of the cache. A GPU multiplies far faster than its memory delivers numbers: hundreds of operations in the time one byte arrives. With five columns per read the arithmetic units had work while the next weights came in; with one column they finish at once and wait for the bus. Same bytes, a fifth of the work per byte: that is why decode is bound by memory bandwidth, and why the bus gauge is the one that is pegged."}, {"scene": "Mechanics", "si": 0, "k": 15, "note": "Prefill: one read for the whole prompt. Decode: one read plus the cache, per token. The loop runs on without a click, and watch the cache counter: each token adds a column, so every later token reads one more cell per layer; the read grows with the length of the conversation. The weight read is the same every step; the cache read is not. On one request it is small next to the weights. With many requests in flight the weights are read once for all of them, while each request's cache is read on its own, and at long contexts it is the cache read, not the weights, that fills the bus. The answer arrives one token per loop, which is why it streams word by word. The counters are the summary of the talk so far. Prefill: one read of the model for the whole prompt, five columns of work per weight, arithmetic-bound. Decode: one read of the model plus a read of a growing cache for every token, one column per weight, bandwidth-bound. Same multiplication, opposite bottleneck, and the gauges showed which one at each moment. Everything that follows is about those two gauges: what they cost, and how to move them."}, {"scene": "Mechanics", "si": 0, "k": 16, "note": "The whole stage then folds into one GPU drawing, because the next question is about the machine. The still picture first. Left, one GPU: the RTX PRO 6000 Blackwell Server Edition, the card in a g7e instance, 96 GB of memory, and its bus gauge pegged because we are about to ask what the bus can do at most. Right, the model, named: a dense 32B in fp8, one byte per weight, so every token reads all 32 GB. Two numbers from two spec sheets, the card's bandwidth and the model's bytes per token. The next click divides one by the other."}, {"scene": "DecodeCeiling", "si": 1, "k": 0, "note": "RTX PRO 6000 Blackwell Server Edition, 96 GB GDDR7: the GPU in a g7e instance. Two words for the rest of the talk. Latency is how fast one request gets its tokens; throughput is how many tokens the whole GPU produces per second for everyone. Start with latency, because it has a ceiling anyone can compute before renting anything, from two numbers. The card: this is the RTX PRO 6000 Blackwell Server Edition, the GPU inside a g7e instance, 96 GB of GDDR7, and its spec sheet says it moves 1.6 terabytes per second; the 1.8 often quoted is the workstation card. The model: a dense 32B in fp8 reads every weight for every token, 32 GB. Divide, and no request on this card can decode faster than 50 tokens per second, 20 milliseconds between tokens, whatever the software does. Do this division for any model you are considering; it is the per-user speed limit in ten seconds."}, {"scene": "DecodeCeiling", "si": 1, "k": 1, "note": "The model this talk measures is built differently: 30B weights in total, but only about 3B of them are read for any one token. How it manages that is knob two, later; for now take the number. 3 GB per token against the same 1.6 terabytes per second gives about 530 tokens per second for one request, under two milliseconds between tokens. Ten times the dense ceiling, from the same card, because the token reads a tenth of the bytes."}, {"scene": "DecodeCeiling", "si": 1, "k": 2, "note": "throughput: tokens per second from the whole GPU. Here 175: with one request, the two are the same number. Measured alone, the same request decodes at about 175 tokens per second, 5.7 milliseconds between tokens, a third of its ceiling. The gap is overhead per step: a few hundred kernel launches, the scheduler, the expert router, none of which is bandwidth. Watch the gauge: we measured the memory controller busy 39 percent of the time with one request in flight; the rest of the time the bus is idle. Now the two words, written down. Latency: 5.7 milliseconds between this request's tokens. Throughput: 175 tokens per second from the whole GPU, and with one request that is the same number, because one request is all there is. Hold on to the idle bus."}, {"scene": "DecodeCeiling", "si": 1, "k": 3, "note": "The same division on a different card, because the card is half the answer. The H100 in a p5 instance moves 3.35 terabytes per second, twice this card's 1.6, so both ceilings double: 105 tokens per second for the dense 32B, about 1,120 for this model, under a millisecond between tokens. That is what hardware buys, and it is the only thing that raises this line; no engine setting does. Then the measurement, the other half. At eight requests in flight this model decoded at 67 tokens per second per request here and 102 on the H100; the dense 27B in fp8 went from 35 to 54. Half again on both, not twice: part of every step is overhead that bandwidth does not shrink, and the faster the bus, the larger that part's share. How large depends on the kernel the engine picks for the model, and that showed when a fourth family was measured on the same two cards: twice the bandwidth bought 26 percent on this model, 20 to 58 percent on a dense 31B, and nothing on a mixture of experts whose wide attention heads forced both cards onto the same slow kernel. The card sets the ceiling; the kernel decides how close a model gets, and the engine's startup log names the kernel it chose. So: the card sets the latency ceiling. Throughput is a different question, and one request answers it badly, with the bus idle most of the time. The engine
