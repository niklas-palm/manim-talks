const D={"scenes": [{"name": "Opening", "src": "media/videos/s00_title/1080p60/Opening.mp4", "ends": [7.767], "notes": ["This talk is for engineers who have used a chat assistant and want to see what an agent actually is, in the machinery rather than the marketing. One sentence carries it: an agent is a model called in a loop over a growing list of messages, where the model may answer with a request to run a tool instead of an answer, and the application runs the tool, appends the result and calls the model again. Everything on screen for the next twelve minutes is one picture of that sentence, growing. Four moves: why one call is not enough, the loop, the loop as code with the places you can intercept it, and the one thing the loop carries, the list, which is also its limit."]}, {"name": "OneCall", "src": "media/videos/s01_onecall/1080p60/OneCall.mp4", "ends": [4.85, 5.75, 8.1], "notes": ["Start with the simplest thing that can be called an assistant. A user types a question. The application puts it into a list of messages, the blue block, and sends the whole list to the model. The model reads it and produces one reply, in words, the violet block, which is appended to the same list and shown to the user. One call, one answer. It is also the end of the story: the model has read a sentence and written a sentence. It cannot look at anything.", "There is a camera on the house. The model knows nothing about it and, more to the point, could not use it if it did: a language model takes text in and puts text out. Whatever the answer requires from the world, the world is on the other side of a wall the model cannot cross. Every agent framework exists to get across that wall, and the way across is not to make the model do more; it is to change what goes into the call.", "Look at what one call actually carries, because the whole trick lives there. Not just the user's question: the application also sends a system prompt, the grey block, the standing instructions for this assistant, and it sends every message so far, every time. The model has no memory between calls; the list is the memory, and it is resent in full. So if we want the model to reach the camera, the only place to say so is inside this call. That is the next move."]}, {"name": "TheLoop", "src": "media/videos/s02_loop/1080p60/TheLoop.mp4", "ends": [1.6, 2.5, 5.85, 8.1, 10.45, 15.75], "notes": ["The application declares tools. A tool definition is three things and nothing more: a name, a description in plain words, and the schema of its arguments. The yellow cards are the definitions of three functions the application can run: ask a camera what it sees, read the outdoor temperature, fetch recordings. They go into the call next to the system prompt and the messages. The model still cannot call anything; it has only been told what the application could call on its behalf. The devices on the right are still out of the model's reach, and stay so.", "Where does a definition come from? From the function, usually by a decorator: the function's name becomes the tool's name, the first paragraph of its docstring becomes the description, and the type hints become the input schema. The colours on the code are the colours on the card. This is worth a pause, because the description is the only thing the model has to decide with. A vague docstring is a vague tool. The best advice in the field is to write it as you would for a new colleague: what it does, when to use it, what the arguments mean.", "The user asks again. The same list goes in, now with the tool definitions, and the model's reply is different in kind: not words, a structured request, the yellow block. It names a tool and fills in the arguments: camera two, the question. The reply carries a stop reason that says so, tool_use rather than end_turn. The model chose that tool by matching the question against the descriptions; the description that matched lit up for a moment. Note what the model did not do: it did not call anything. It asked.", "The application reads the request, runs the real function against the real camera, and gets an answer back: a person by the shed. That answer becomes a message too, the teal block, a tool result tagged with the id of the request it answers, and it is appended to the list in the user's role, because from the model's point of view it is the world speaking. Nothing here needed the model; this step is ordinary code. It is also the step where every safety decision lives: the application can refuse, log, or ask a human before it runs anything.", "Then the model is called again, with everything: the question, its own tool request, the result. Now it can answer in words, and it does: yes, one person by the shed. The stop reason is end_turn, and that is what ends the loop. The user sees only the last block; the whole exchange in between, the request and the result, happened inside the application and stays in the list. Two model calls, one tool call, one answer.", "That is the whole agent, and here it is drawn as the loop it is: call the model; if the reply is a tool request, run it, append the result, call again; if the reply is words, stop. Watch a second question go round at speed: warm enough to leave the door open? The model asks for the temperature, the application reads the thermometer, 19 degrees goes into the list, the model answers. The loop runs as many times as the model asks; a real one also stops on a turn or token budget, so a confused model cannot run forever. Everything an agent framework adds sits on this loop. Next, the loop as code, because it is shorter than you think."]}, {"name": "TheCode", "src": "media/videos/s03_code/1080p60/TheCode.mp4", "ends": [2.8, 10.2, 11.4, 15.95], "notes": ["Here is the loop from the last move written down, and it is eight lines. Send the system prompt, the tools and the messages to the model; append what comes back; if the reply asked for tools, run them, append the results and go round again; otherwise return the reply. Every agent framework you will meet is this function plus bookkeeping: streaming, retries, budgets, logging. The shape never changes, and once you can see it, you can read any of them.", "Run it against the picture. The highlight is the line executing; the picture does what the line says. The question joins the list; invoke sends the list to the model; the reply is a tool request and is appended; the stop reason says tool_use, so the tools run, the camera answers, the result is appended, and the function calls itself with the longer list. Second time round the reply is words, the stop reason is end_turn, the function returns and the user gets the answer. Two passes through eight lines.", "Because the loop is this small, everything an application wants to do to an agent is a hook at one of these points: before and after the whole invocation, before and after each model call, before and after each tool call, and whenever a message is added. A hook can inspect the event, for logging and tracing; it can modify it, rewriting a tool's arguments or a result; and at some points it can cancel. Names differ between frameworks; the points do not, because they are the joints of the loop itself.", "One hook in action. The user asks for last night's recordings to be deleted, and the model, doing its job, asks for a tool that would. The before-tool-call hook is where the application's policy lives: it cancels the call, the camera is never touched, and what goes into the list instead is a result saying so. The model is called again, reads the refusal, and tells the user. The model was never in charge of the deletion; the loop was, and the loop is code you own. That is the design principle behind every guardrail and every approval prompt you have seen an agent show."]}, {"name": "TheState", "src": "media/videos/s04_state/1080p60/TheState.mp4", "ends": [6.8, 10.65, 12.45, 14.45], "notes": ["One thing carries over from call to call, and it is the list. The model keeps nothin e memory. Both are the next talk. This one ends where it began: a model, a list of messages, and a loop."]}], "steps": [{"scene": "Opening", "si": 0, "k": 0, "note": "This talk is for engineers who have used a chat assistant and want to see what an agent actually is, in the machinery rather than the marketing. One sentence carries it: an agent is a model called in a loop over a growing list of messages, where the model may answer with a request to run a tool instead of an answer, and the application runs the tool, appends the result and calls the model again. Everything on screen for the next twelve minutes is one picture of that sentence, growing. Four moves: why one call is not enough, the loop, the loop as code with the places you can intercept it, and the one thing the loop carries, the list, which is also its limit."}, {"scene": "OneCall", "si": 1, "k": 0, "note": "Start with the simplest thing that can be called an assistant. A user types a question. The application puts it into a list of messages, the blue block, and sends the whole list to the model. The model reads it and produces one reply, in words, the violet block, which is appended to the same list and shown to the user. One call, one answer. It is also the end of the story: the model has read a sentence and written a sentence. It cannot look at anything."}, {"scene": "OneCall", "si": 1, "k": 1, "note": "There is a camera on the house. The model knows nothing about it and, more to the point, could not use it if it did: a language model takes text in and puts text out. Whatever the answer requires from the world, the world is on the other side of a wall the model cannot cross. Every agent framework exists to get across that wall, and the way across is not to make the model do more; it is to change what goes into the call."}, {"scene": "OneCall", "si": 1, "k": 2, "note": "Look at what one call actually carries, because the whole trick lives there. Not just the user's question: the application also sends k's defaults are a good picture of the trade: summarise the oldest thirty percent, always keep the ten most recent. So the list is the agent's whole state, it is resent on every call, and managing its length is the application's job, not the model's. Save the list per user and you have a session; put facts somewhere the loop can fetch them with a tool and you have memory. Both are the next talk. This one ends where it began: a model, a list of messages, and a loop."}]};const S=D.scenes,ST=D.steps;let i=-1;
const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element
    if(vids[other()].dataset.si!==String(st.si))load(vids[other()],st.si);
    const v=vids[other()];v.currentTime=start;cur=other();
    vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
    v.play().catch(()=>{});if(ST[k+1]&&ST[k+1].si!==st.si)load(vids[1-cur],ST[k+1].si);
    if(S[st.si+1])load(vids[1-cur],st.si+1);
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});}
  hold(vids[cur],end);onstep&&onstep(k);
}
let holdId=0;
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.03){v.pause();v.currentTime=end-0.001;return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}
