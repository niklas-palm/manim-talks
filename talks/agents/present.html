const D={"scenes": [{"name": "TheApi", "src": "media/videos/s01_api/1080p60/TheApi.mp4", "ends": [1.5, 7.1, 11.15], "notes": ["This talk is for engineers who have used a chat assistant and want to see what an agent actually is. One sentence carries it: a model is called in a loop over a growing list of messages; it may answer with a request to run a tool instead of an answer; the application runs the tool, appends the result, and calls the model again. Everything on screen for the next fifteen minutes is one picture of that sentence, growing. But we start before agents, with a plain application. A user on the left. In the middle an application: a box that will hold a list of messages, and at the bottom its entire code, three lines: take a question, fetch the latest frame from camera two, send frame and question to the model, return the answer. A model top right. A camera API on the right, which that code calls. Two counters: model calls, and tool calls, which stay at zero for a while. Nothing here is an agent.", "The user asks whether anyone is in the backyard. Follow the code. Line two runs: the application calls the camera API and gets the latest frame. The frame and the question become the list. Line three: one model call, the whole list goes in, and one reply comes back in words: yes, one person by the shed. One model call per question. This is a perfectly good application, and it is how most teams first used a model: the code decides what to fetch, fetches it, and asks the model to read it.", "A second question: is it warm enough to open the door? The code does the only thing it knows, fetches a camera frame, and the model answers honestly that a frame has no temperature in it. A thermometer exists, right there, but no code path reaches it, because line two decided what to fetch before the model ever saw the question. Notice also what every call carried: the whole list, again; the model keeps nothing between calls. That is the wall an agent removes: the decision of what to look at has to move from the code to the model. The next move is about how, and it starts with a change of vocabulary."]}, {"name": "ToolFromApi", "src": "media/videos/s02_tool/1080p60/ToolFromApi.mp4", "ends": [1.0, 6.5, 7.8, 10.45], "notes": ["The same application, its conversation cleared, and the three lines moved up where we can look at them. Read them as one thing: fetch a frame from a camera, ask a vision model about it. That is a capability. The change of vocabulary that makes an agent possible is to name that capability as one unit, a tool, so that it can be one of several, and so that something other than the code can decide when to use it.", "The process becomes a function with a name and typed arguments, plus two additions and nothing else: a decorator, and a docstring. Watch the tool definition fill in on the right as the highlight walks the code. The decorator says: offer this to the model. The function's name is the tool's name. The first line of the docstring is the description, and that description is what the model will read when it decides whether this tool answers a question; write it as you would for a junior colleague. The type hints and the argument list become the input schema. The camera API is still there, as the thing the function reaches. Nothing about the process changed; it has a name now.", "Once the process has a name, the thermometer and the camera archive get the same treatment: two more functions, two more cards, each tied to the device it reaches. The line that matters for security and for architecture: what crosses to the model is the cards, name, description and schema, text. What stays in the application is the code, the API endpoints and the credentials. The model never executes anything; it can only ask.", "And now the new problem, the one the old code never had: with three tools, which one does a question need? Not the code; the code deciding was the wall. The model can choose, if it is told what the tools are: the cards go into the call beside the system prompt and the messages, and the model answers with the name of a tool and the arguments it wants. But a choice is not an answer. The application has to run the chosen tool, put the result into the list, and ask the model again, until the model answers in words. That is the loop, and in the next move the application runs it."]}, {"name": "TheLoop", "src": "media/videos/s03_loop/1080p60/TheLoop.mp4", "ends": [1.0, 4.35, 6.4, 8.65, 13.35], "notes": ["The same picture with the three tool cards in place and an empty list. Read the arrow into the model once more: the system prompt, the tools, and the messages. From here on every call carries the cards too, so the model knows what it can ask for. Nothing on the right has a loop in it yet; the loop is something the application is about to do, with its own code.", "The question that failed in move one. It joins the list, the list and the cards go to the model, and the reply is not words. It is a tool call: a structured message naming query_temperature, with the arguments the schema asked for, none here, and a stop reason that says tool_use. The model chose that tool from the descriptions; nobody wrote a rule. It cannot run it; it can only ask.", "The application sees the tool call, finds the function behind the card, runs it against the real thermometer, and appends the result to the list as a message in the user's role, tagged with the call it answers. Tool calls: one. Nothing has been decided about the door yet; the model has not seen the number.", "Called again with the longer list, the model has the number and answers in words, and the stop reason says end_turn. That is the whole loop: call, if the reply is a tool call then run it and append the result and call again, otherwise the turn is over. Two model calls, one tool call, one question the code alone could not answer.", "Now the first question again, at speed, through the same loop: the model asks for camera two with a question of its own choosing, the application fetches, the result joins the list, the model answers. Compare with move one: the code no longer decides what to look at; it only executes what the model asks for and keeps the list. That shift is the whole definition of an agent, and notice who runs the loop: the application, in its own code. Four model calls and two tool calls for two questions, and the list has grown to eight messages; keep an eye on that."]}, {"name": "TheCode", "src": "media/videos/s04_code/1080p60/TheCode.mp4", "ends": [1.8, 5.05, 6.85, 8.95, 9.95, 11.6, 12.6, 13.4, 17.2, 18.4, 20.2, 22.4], "notes": ["Everything the application did by hand in move three, a framework does behind one call. The picture stepped aside to the left, small: the model, the list, the three tools; a new agent, so the list is empty. On the right, the whole agent as Strands writes it: a model, a system prompt, the list of tools, and then a question. There is no loop in this code. The loop is inside the Agent, and this move is about what is inside.", "The last line runs. Watch the picture, because there is nothing to read: the question joins the list, the list goes to the model, a tool call comes back, the thermometer answers, the result joins the list, the model is called again and answers in words. Four messages, two model calls, one tool call, and the application wrote none of it. That is what a framework is for. Now open it up.", "Inside the Agent is this: eight lines. The list rewound to the question so we can watch the same call again, slowly. Read the code once, top to bottom, before it runs: call the model with the system prompt, the tools and the messages; append the reply; if the reply is a tool call, run it, append the result, and call the loop again; otherwise return the reply. Every agent framework is this, plus bookkeeping.", "One line per click. Line one: the whole list, with the system prompt and the tool definitions, goes into the model, and the model works. Everything the model will ever know about this conversation is what went in here.", "Line two: the reply comes out and is appended to the list, whatever it is. This time it is a tool call, yellow, so the list is one message longer before anything has been decided.", "Line three is the test: did the model stop because it wants a tool? It did. Line four: the framework looks up the function behind the card and runs it against the real device. This is the only line where anything happens in the world, and it is your function that runs.", "Line five: the result comes back from the tool and is appended, as a message in the user's role, teal. The model has not seen it yet; it is just in the list.", "Line six: the loop calls itself with the longer list, and the bar is back at the top. That is the whole loop: nothing in it knows about cameras or thermometers; it calls, appends, runs, appends, and calls again.", "A second pass at speed, one more tool call than the fast run needed, to show the loop does not care how many. On the third call the reply is words, violet, the test is false, and line eight returns it. Six messages from eight lines; the model made every decision, the code made none.", "Because the framework owns the loop, it can let you in at every place the loop has. Strands calls these hooks, and names an event for each: before and after the whole invocation, before and after each model call, before and after each tool call, and whenever a message is added. A hook can inspect, change or cancel. The names and the event set are this SDK's; other frameworks expose some of the same places under other names, because the loop has no other places. Guardrails, logging, cost limits, approval steps and tracing are all hooks at one of these dots.", "One hook in action. The model asks to delete a recording; a before-tool-call hook checks a policy and cancels the call. The tool never runs, and the refusal becomes the tool result, so the model learns it was refused and tells the user instead of pretending. This is the shape of every guardrail in an agent: the model asks, your code decides.", "And the eight lines fold back into the definition, which has gained one line: the hook, registered on the agent. That is the trade a framework offers. You write the tools and the hooks; it runs the loop, keeps the list and raises the events. If you understood the loop, you understand what it does for you and what it cannot do: it cannot decide what your tools are, and it cannot make the list stop growing. That last one is the next move."]}, {"name": "TheState", "src": "media/videos/s05_state/1080p60/TheState.mp4", "ends": [1.8, 4.55, 6.95, 9.35], "notes": ["The list as move three left it, eight messages, and around it a dashed frame: the context window, the most the model can take in one call. Drawn here as eight messages; a real window is counted in tokens, a few hundred thousand for current models, and a long tool result or a large document eats it fast. The list is the only state the loop has, and this is its limit.", "Every call sends the whole list, so the list is also what every call costs. Then one tool result arrives that is far larger than the others: the camera archive returns forty thousand tokens of detections. It does not fit under the window, and the next call is refused; the model never sees it. Nothing in the loop protects against this, because the loop only appends. Something has to shorten the list, and there are two honest ways.", "The first remedy: a sliding window. The oldest messages leave, and they leave in pairs: a tool call and its result go together, because a result without its call, or a call without its result, is a malformed conversation that the model will reject. Now the big result fits. The price is that the model has forgotten the door was opened.", "The second remedy: summarisation. The oldest messages are replaced by one message that says what happened in them, written by a model call of its own, and the most recent messages stay word for word because that is where the model needs detail. The list is shorter and the door is still remembered, at the cost of a call and of whatever the summary left out. Everything beyond this point, sessions, memory stores, retrieval, is a way of deciding what goes into this list. That is the next talk. This one ends where it started: a model, a list of messages, and a loop."]}, {"name": "EveryAgent", "src": "media/videos/s06_every/1080p60/EveryAgent.mp4", "ends": [1.4, 10.4, 11.3], "notes": ["Last move. Keep everything and change only the three cards. A coding agent, Claude Code, Codex, the agent in your editor, is exactly this picture: a model, a list of messages, a loop the harness runs. The difference is what the tools are. Ours knew about one house. Theirs are generic: run a shell command, read a file, write a file. Three tools that can do almost anything, because with a shell and a file system the agent can make whatever tool it needs on the spot: write a script, run it, read the output.", "A coding task through the same loop, at speed. The user asks for a retry in the upload function. The model does not know the code, so it asks for a shell command to find it, writes the change, runs the tests, and only then answers in words. Four model calls, three tool calls, no code path in the harness that knew anything about uploads or retries. Every decision was the model's; the harness ran the loop and kept the list. Read the last move again with this in mind: the list grew by eight messages for one task, and a real session does this hundreds of times, which is why every coding agent compacts its context.", "So the whole talk is one picture. A plain application with one model call, whose code decided what to fetch. The same process named as a tool, then several tools, and the model choosing among them. The application running the loop: call, run, append, call again, until the model answers in words. A framework hiding that loop behind one call. The list const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element, but only once it shows the right frame
    const v=vids[other()];if(v.dataset.si!==String(st.si))load(v,st.si);
    let done=false;const go=()=>{if(done)return;done=true;cur=1-cur;vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
      v.play().catch(()=>{});hold(v,end);if(S[st.si+1])load(vids[1-cur],st.si+1);};
    if(v.readyState>=2&&Math.abs(v.currentTime-start)<0.04)go();
    else{v.addEventListener('seeked',go,{once:true});v.currentTime=start;setTimeout(go,600);}   // a swap before the seek lands would flash the element's old frame
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});hold(v,end);}

let holdId=0;
// Stop a few frames before the boundary: the check runs once per animation frame, so playback can overshoot into the
// next step's first frame by the time it is seen, and a seek to end-0.001 can snap onto that frame too. Steps end on a
// settled picture, so 0.06 s (four frames at 60 fps) before the boundary is the same picture.
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.1){v.pause();v.currentTime=Math.max(0,end-0.06);return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')next();else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(e.key==='f')document.documentElement.requestFullscreen();else if(e.key==='Home')show(0);});
document.addEventListener('click',e=>{if(i>=0)next();});
