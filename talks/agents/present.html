const D={"scenes": [{"name": "TheApi", "src": "media/videos/s01_api/1080p60/TheApi.mp4", "ends": [1.5, 6.6, 10.25, 12.7], "notes": ["This talk is for engineers who have used a chat assistant and want to see what an agent actually is. One sentence carries it: a model is called in a loop over a growing list of messages; it may answer with a request to run a tool instead of an answer; the application runs the tool, appends the result, and calls the model again. Everything on screen for the next twelve minutes is one picture of that sentence, growing. The picture for the whole talk, still. A user on the left. An application in the middle: a box that will hold a list of messages. A model top right: every call sends it the system prompt and every message, and one reply comes back. On the right, a camera API, which the application's own code knows how to call. Two counters at the bottom: model calls, and tool calls, which stay at zero for a while. Nothing here is an agent yet.", "The user asks whether anyone is in the backyard. Watch the order. The question becomes the first message. The application's code calls the camera API, gets a frame, and puts the frame and the question into the list as a second message. Then the whole list goes into the model, and one reply comes back in words: yes, one person by the shed. One model call. This is how most applications used models before agents: the code decided what to fetch, fetched it, and asked the model to read it.", "A second question: is it warm enough to open the door? The code does what it always does, fetches a camera frame, and the model answers honestly that a frame has no temperature in it. A thermometer exists, right there, but no code path reaches it, because the code decided what to fetch before the model ever saw the question. That is the wall an agent removes: the decision of what to look at has to move from the code to the model. Everything in the next move is about how.", "One more thing to see before the wall comes down, because the rest depends on it. The model keeps nothing between calls. Each call sends the system prompt and every message so far, the whole list, and the reply is computed from that and nothing else. So the list is the only memory the application has, and the only place a conversation exists. Hold on to that: it is what the loop will grow, and it is what runs out at the end of the talk."]}, {"name": "ToolFromApi", "src": "media/videos/s02_tool/1080p60/ToolFromApi.mp4", "ends": [1.6, 7.1, 8.8], "notes": ["Same picture, and inside the application the function that fetched the frame in move one, exactly as it is: three lines, a name, two typed arguments, a call to the camera API, a call to a vision model on the frame. Nothing about it is agent-specific. This is the code most teams already have.", "Two additions and nothing else: a decorator, and a docstring. Watch the tool definition fill in on the right as the highlight walks the code. The decorator says: offer this function to the model. The function's name becomes the tool's name. The first line of the docstring becomes the description, and that description is what the model reads when it decides whether this tool answers the question; write it as you would for a junior colleague. The type hints and the argument list become the input schema, a JSON schema the model must fill in. The camera API is still there, as the thing the function reaches; it did not change at all.", "Two more functions get the same treatment: one reads the thermometer, one searches the camera archive. Three cards, each still tied to the device it reaches. Now the line that matters for security and for architecture: what crosses to the model is the cards, name, description and schema, text. What stays in the application is the code, the API endpoints and the credentials. The model never executes anything; it can only ask. In the next move it does."]}, {"name": "TheLoop", "src": "media/videos/s03_loop/1080p60/TheLoop.mp4", "ends": [1.0, 4.35, 6.4, 8.65, 13.35], "notes": ["The same picture with the three tool cards in place and an empty list. Read the arrow into the model once more: the system prompt, the tools, and the messages. From here on every call carries the cards too, so the model knows what it can ask for.", "The question that failed in move one. It joins the list, the list and the cards go to the model, and the reply is not words. It is a tool call: a structured message naming query_temperature, with the arguments the schema asked for, none here, and a stop reason that says tool_use. The model chose that tool from the descriptions; nobody wrote a rule. It cannot run it; it can only ask.", "The application sees the tool call, finds the function behind the card, runs it against the real thermometer, and appends the result to the list as a message in the user's role, tagged with the call it answers. Tool calls: one. Nothing has been decided about the door yet; the model has not seen the number.", "Called again with the longer list, the model has the number and answers in words, and the stop reason says end_turn. That is the whole loop: call, if the reply is a tool call then run it and append the result and call again, otherwise the turn is over. Two model calls, one tool call, one question the code alone could not answer.", "Now the first question again, at speed, through the same loop: the model asks for camera two with a question of its own choosing, the application fetches, the result joins the list, the model answers. Compare with move one: the code no longer decides what to look at; it only executes what the model asks for and keeps the list. That shift is the whole definition of an agent. Four model calls and two tool calls for two questions, and the list has grown to eight messages; keep an eye on that."]}, {"name": "TheCode", "src": "media/videos/s04_code/1080p60/TheCode.mp4", "ends": [1.8, 11.7, 12.9, 15.1], "notes": ["The loop from move three written down: eight lines. The picture stepped aside to the left, small: the model, the eight messages, the three tools. Read the code once, top to bottom, before it runs: call the model with the system prompt, the tools and the messages; append the reply; if the reply is a tool call, run it, append the result, and call the loop again; otherwise return the reply. Every agent framework is this, plus bookkeeping.", "Now it runs against the picture, slowly the first time. Line one: the list goes into the model. Line two: the reply joins the list, a tool call. Line three, the test, is true. Line four: the tool runs against its device. Line five: the result joins the list. Line six: the loop calls itself, and the bar is back at the top. The second pass at speed, and on the third the reply is words, the test is false, and line eight returns. Ten messages produced by eight lines; the model made every decision, the code made none.", "Where can you intercept this loop? Every framework offers the same eight points, because the loop only has eight places: before and after the whole invocation, before and after each model call, before and after each tool call, and whenever a message is added. A hook there can inspect, change or cancel. Guardrails, logging, cost limits, approval steps and tracing are all hooks at one of these dots; nothing else is needed.", "One hook in action. The model asks to delete a recording; a before-tool-call hook checks a policy and refuses. The tool never runs, and the refusal becomes the tool result, so the model learns it was refused and tells the user instead of pretending. This is the shape of every guardrail in an agent: the model asks, the application decides."]}, {"name": "TheState", "src": "media/videos/s05_state/1080p60/TheState.mp4", "ends": [1.8, 4.55, 6.95, 9.35], "notes": ["The list as move three left it, eight messages, and around it a dashed frame: the context window, the most the model can take in one call. Drawn here as eight messages; a real window is counted in tokens, a const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element, but only once it shows the right frame
    const v=vids[other()];if(v.dataset.si!==String(st.si))load(v,st.si);
    let done=false;const go=()=>{if(done)return;done=true;cur=1-cur;vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
      v.play().catch(()=>{});hold(v,end);if(S[st.si+1])load(vids[1-cur],st.si+1);};

    else{v.addEventListener('seeked',go,{once:true});v.currentTime=start;setTimeout(go,600);}   // a swap before the seek lands would flash the element's old frame
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});hold(v,end);}

let holdId=0;

// settled picture, so 0.06 s (four frames at 60 fps) before the boundary is the same picture.
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.1){v.pause();v.currentTime=Math.max(0,end-0.06);return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
