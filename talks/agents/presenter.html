<script>
const ch=new BroadcastChannel('talk');const t0=[Date.now()];let aud=null;
const tell=m=>{ch.postMessage(m);if(aud&&!aud.closed)aud.postMessage(m,'*');};
let onstep=k=>{const s=ST[k],n=ST[k+1];document.getElementById('pos').textContent=(k+1)+' / '+ST.length;document.getElementById('scene').textContent=s.scene;
document.querySelector('#note h3').textContent=s.scene.replace(/([a-z])([A-Z])/g,'$1 $2');document.getElementById('txt').textContent=s.note;
document.getElementById('nextnote').textContent=n?('next: '+n.scene+(n.scene!==s.scene?' (new scene)':'')+'. '+n.note.slice(0,240)+(n.note.length>240?'...':'')):'end of talk';
preview(n);};
function preview(n){const nv=document.getElementById('n');if(!n){nv.removeAttribute('src');nv.load();return;}const sc=S[n.si],at=Math.max(0,sc.ends[n.k]-0.05);   // the last frame of the next step: where 'next' will end up
  const seek=()=>{nv.pause();nv.currentTime=at;};if(nv.dataset.si!==String(n.si)){nv.dataset.si=n.si;nv.src=sc.src;nv.addEventListener('loadedmetadata',seek,{once:true});nv.load();}else seek();}

const D={"scenes": [{"name": "Opening", "src": "media/videos/s00_title/1080p60/Opening.mp4", "ends": [7.883], "notes": ["This talk is for engineers who have used a chat assistant and want to see what an agent actually is, in the machinery rather than the marketing. One sentence carries it: an agent is a model called in a loop over a growing list of messages, where the model may answer with a request to run a tool instead of an answer, and the application runs the tool, appends the result and calls the model again. Everything on screen for the next twelve minutes is one picture of that sentence, growing. Five moves: an application that already calls an API, that API turned into a tool, the loop, the loop as code with the places you can intercept it, and the one thing the loop carries, the list, which is also its limit."]}, {"name": "TheApi", "src": "media/videos/s01_api/1080p60/TheApi.mp4", "ends": [7.1, 12.1, 14.75], "notes": ["Start where every team starts, with an application that already works. A user asks whether anyone is in the backyard. The application has a function for that: query_camera calls the camera API, gets a frame back, and puts the frame and the question into a prompt, after a system prompt that says what this assistant is. The whole list goes to the model, and the model answers in words: yes, one person by the shed. Notice who did what. The application decided to call the camera, before it knew the question. The model only read what it was given and answered. It is a good application. It is not an agent.", "Now a different question: is it warm enough to open the door? The application runs the only code it has. It fetches a camera frame again, because that is what the code does for every question, and sends it with the question. The model, honestly, cannot read a temperature from a photograph. There is a thermometer on the house, but no code path reaches it, and the model could not ask for one if it wanted to: it produces text. This is the wall. The decision of what to fetch was made by a programmer before the question existed, and every new kind of question means new application code. The way over the wall is not a smarter model; it is to move that decision into the call.", "Look at what one call carries, because the whole trick lives there. Not just the newest question: the application sends the system prompt, the grey block, and every message so far, every time, in full. The model keeps nothing between calls; the list is the memory, and the application owns it. So there is exactly one place where the model could be given the choice of what to fetch, and it is inside this call. The next move takes the function we already have and puts a description of it into the call. That is all a tool is."]}, {"name": "ToolFromApi", "src": "media/videos/s02_tool/1080p60/ToolFromApi.mp4", "ends": [3.85, 8.7, 11.25], "notes": ["Here is that function, three lines. Given a camera number and a question, it fetches the current frame from the camera API and asks a vision model the question about the frame. Nothing about it is agentic; it is the code the application already had. Keep it exactly as it is. What changes is not the function but what the model is told about it.", "Two additions and nothing else. A decorator marks the function as a tool, and a docstring says in plain words what it does and what its arguments mean. From those the framework derives the tool definition, the card on the left, and the card has exactly three fields. The name is the function's name. The description is the first paragraph of the docstring. The input schema comes from the type hints and the argument descriptions: camera is an integer, question a string. This is worth a pause: the description is the only thing the model will have to decide with. A vague docstring is a vague tool. Write it as you would for a new colleague.", "Do the same for two more functions and the application has three tools: ask a camera what it sees, read the outdoor temperature, fetch recordings since a time. Each card faces a device on the right, because each is a door to one part of the world. Now the line that matters. What crosses to the model is the three cards: names, descriptions, schemas. What stays in the application is everything else: the code, the API endpoints, the credentials. The model will be able to ask for a door to be opened; it will never hold the key. The next move puts the cards into the call and watches what the model does with them."]}, {"name": "TheLoop", "src": "media/videos/s03_loop/1080p60/TheLoop.mp4", "ends": [3.35, 4.55, 6.8, 9.05, 14.65], "notes": ["The three cards take the place of the plain function, each on the row of the device it reaches, and they go into the call next to the system prompt and the messages. Watch the whole bundle shrink into the model: system prompt, three definitions, every message. The model still cannot call anything; it has been told what the application could call on its behalf. The devices stay where they were, out of the model's reach, and they will stay there.", "And the reply is different in kind. Not words: a structured request, the yellow block. It names a tool, query_temperature, and fills in its arguments, none in this case. The reply carries a stop reason that says so: tool_use rather than end_turn. The model chose that tool by matching the question against the three descriptions; the one that matched lit up for a moment. Note what the model did not do. It did not read the thermometer. It asked.", "The application reads the request, runs the real function against the real thermometer, and gets 19 degrees. That answer becomes a message too, the teal block, a tool result tagged with the id of the request it answers, appended in the user's role, because from the model's point of view it is the world speaking. Nothing here needed the model; this step is ordinary code. It is also the step where every safety decision lives: the application can refuse, log, or ask a human before it runs anything.", "Then the model is called again, with everything: the question, its own request, the result. Now it can answer in words, and it does: 19 degrees, yes, open it. The stop reason is end_turn, and that is what ends the loop. The user sees only the last block; the request and the result stayed inside the application, in the list. Compare with move one: the same question, the same thermometer, but this time the model decided to read it. Two model calls, one tool call, one answer.", "That is the whole agent, and here it is drawn as the loop it is: call the model; if the reply is a tool request, run it, append the result, call again; if the reply is words, stop. Watch the first question from move one go round at speed: anyone in the backyard? This time the model asks for the camera, the application runs the same function it always had, the frame's answer goes into the list, the model answers. The loop runs as many times as the model asks; a real one also stops on a turn or token budget, so a confused model cannot run forever. Everything an agent framework adds sits on this loop. Next, the loop as code, because it is shorter than you think."]}, {"name": "TheCode", "src": "media/videos/s04_code/1080p60/TheCode.mp4", "ends": [2.4, 9.8, 11.0, 15.75], "notes": ["Here is the loop from the last move written down, and it is eight lines. Send the system prompt, the tools and the messages to the model; append what comes back; if the reply asked for tools, run them, append the results and go round again; otherwise return the reply. Every agent framework you will meet is this function plus bookkeeping: streaming, retries, budgets, logging. The shape never changes, and once you can see it, you can read any of them.", "Run it against the picture. The bar is the line executing; the picture does what the line says. The question joins the list; the call sends the list to the model; the reply is a tool request and is appended; the stop reason says tool_use, so the tool runs, the camera answers, the result is appended, and the function calls itself with the longer list. Second time round the reply is words, the stop reason is end_turn, the function returns and the user gets the answer. Two passes through eight lines.", "Because the loop is this small, everything an application wants to do to an agent is a hook at one of these points: before and after the whole invocation, before and after each model call, before and after each tool call, and whenever a message is added. A hook can inspect the event, for logging and tracing; it can modify it, rewriting a tool's arguments or a result; and at some points it can cancel. Names differ between frameworks; the points do not, because they are the joints of the loop itself.", "One hook in action. The user asks for last night's recordings to be deleted, and the model, doing its job, asks for a tool that would. The before-tool-call hook is where the application's policy lives: it cancels the call, the archive is never touched, and what goes into the list instead is a result saying so. The model is called again, reads the refusal, and tells the user. The model was never in charge of the deletion; the loop was, and the loop is code you own. That is the design principle behind every guardrail and every approval prompt you have seen an agent show."]}, {"name": "TheState", "src": "media/videos/s05_state/1080p60/TheState.mp4", "ends": [7.0, 10.85, 12.65, 14.65], "notes": ["One thing carries over from call to call, and it is the list. The model keeps nothing; every call sends the system prompt, the tools and every message so far, and the third counter says how many. That list has to fit the model's context window, drawn here as room for eight messages; a real window is 200,000 tokens on Claude Haiku 4.5 and a million on Claude Opus 5, but a tool result can be a whole document and an agent can run for hundreds of turns, so the window fills faster than it sounds. Watch one more question go round: four more messages, and the window is full.", "A question about yesterday brings in the archive, and the archive's answer is long. The list now has more than the window holds, and the next call is refused: the model cannot be sent more than it can read. This is the wall every long-running agent hits, and it is not the model's problem to solve, because the model never saw the list grow. The application owns the list, so the application has to make it shorter, and there are two honest ways.", "The first way is a sliding window: keep the last so many messages and let the oldest fall off, the system prompt excepted. One rule makes it safe: a tool request and its result are one unit, because a result whose request is gone, or a request whose result is gone, is a malformed conversation and the model will refuse it; so the window drops them together. The list fits again. The price is memory: the first question and its answer are gone, and the model will not know they happened.", "The second way keeps the memory and pays in precision: ask the model, in a separate call, to summarise the oldest part of the list into one message, and put that in their place; the most recent messages stay as they were. One framework's defaults are a good picture of the trade: summarise the oldest thirty percent, always keep the ten most recent. So the list is the agent's whole state, it is resent on every call, and managing its length is the application's job, not the model's. Save the list per user and you have a session; put facts somewhere the loop can fetch them with a tool and you have memory. Both are the next talk. This one ends where it began: an application, an API that became a tool, a model, a list of messages, and a loop."]}], "steps": [{"scene": "Opening", "si": 0, "k": 0, "note": "This talk is for engineers who have used a chat assistant and want to see what an agent actually is, in the machinery rather than the marketing. One sentence carries it: an agent is a model called in a l const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element
    if(vids[other()].dataset.si!==String(st.si))load(vids[other()],st.si);
    const v=vids[other()];v.currentTime=start;cur=other();
    vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
    v.play().catch(()=>{});if(ST[k+1]&&ST[k+1].si!==st.si)load(vids[1-cur],ST[k+1].si);
    if(S[st.si+1])load(vids[1-cur],st.si+1);
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});}
  hold(vids[cur],end);onstep&&onstep(k);
}
let holdId=0;
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.03){v.pause();v.currentTime=end-0.001;return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}

load(vids[0],0);if(S[1])load(vids[1],1);
function open_audience(){aud=window.open('present.html','audience','width=1280,height=720');setTimeout(()=>tell({go:Math.max(0,i)}),1500);}
function send(d){const k=Math.max(0,Math.min(ST.length-1,i+d));tell({go:k});show(k);}
const handle=d=>{if(d&&d.at!==undefined&&d.at!==i)show(d.at);};
ch.onmessage=e=>handle(e.data);window.addEventListener('message',e=>handle(e.data));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')send(1);else if(e.key==='ArrowLeft')send(-1);else if(e.key==='Home'){tell({go:0});show(0);}else if(e.key==='t')t0[0]=Date.now();});
setInterval(()=>{const s=Math.floor((Date.now()-t0[0])/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);
show(0);tell({hello:1});
