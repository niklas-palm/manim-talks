<script>

const tell=m=>{ch.postMessage(m);if(aud&&!aud.closed)aud.postMessage(m,'*');};
let onstep=k=>{const s=ST[k],n=ST[k+1];document.getElementById('pos').textContent=(k+1)+' / '+ST.length;document.getElementById('scene').textContent=s.scene;
document.querySelector('#note h3').textContent=s.scene.replace(/([a-z])([A-Z])/g,'$1 $2');document.getElementById('txt').textContent=s.note;
document.getElementById('nextnote').textContent=n?('next: '+n.scene+(n.scene!==s.scene?' (new scene)':'')+'. '+n.note.slice(0,240)+(n.note.length>240?'...':'')):'end of talk';
preview(n);};
function preview(n){const nv=document.getElementById('n');if(!n){nv.removeAttribute('src');nv.load();return;}const sc=S[n.si],at=Math.max(0,sc.ends[n.k]-0.05);   // the last frame of the next step: where 'next' will end up
  const seek=()=>{nv.pause();nv.currentTime=at;};if(nv.dataset.si!==String(n.si)){nv.dataset.si=n.si;nv.src=sc.src;nv.addEventListener('loadedmetadata',seek,{once:true});nv.load();}else seek();}

const D={"scenes": [{"name": "TheLog", "src": "media/videos/s01_log/480p15/TheLog.mp4", "ends": [2.133, 6.266, 10.665, 13.998, 17.598], "notes": ["This talk is for engineers who have produced to or consumed from Kafka and never seen the machinery. One sentence carries it: a topic is an append-only log split into partitions, and every reader keeps one integer, an offset into that log. Ordering, parallelism, replay and durability are consequences of those two facts, and each move shows one of them: the log itself, then partitions, then replication, then what happens when disks fill, then who decides. The starting picture, nothing moving yet. A producer on the left. A broker, one machine, holding one topic with a single partition: the empty rail is where records will land, and the numbers that will appear under them are offsets. The legend says what the colours mean: each record is drawn in the colour of its key, alice, bob, carol. Everything in this talk happens to this row of cells.", "Start with one producer, one broker and one topic with a single partition. A record is a key, a value and a timestamp; here the colour is the key: alice, bob, carol. Each record the producer sends lands at the end of the partition and gets the next offset, a number that counts from zero and never changes for as long as the record exists. That is the whole storage model: a file the broker only ever appends to. Nothing is looked up by id, nothing is updated in place, and that is why writes are sequential and cheap.", "A consumer reads by pulling: it asks the broker for records starting at an offset, gets a batch, and moves its own pointer forward. Its whole position in the partition is one integer, the offset of the next record it wants. The broker does not track who has read what; the consumer owns that number, which is why a slow consumer simply falls behind and catches up when it can, and why a fast one can read at the speed of a sequential disk read served from the page cache. The broker keeps no reader state at all.", "A second consumer starts from zero with its own pointer. Reading does not remove anything: the records stay, the two consumers are at different offsets, and the producer keeps appending behind both of them. Producers and consumers never see each other; the log in the middle decouples them completely. This is the difference from a queue: a queue hands each message to one reader and forgets it, a log keeps it and lets any number of readers hold their own place.", "Because the position is one integer the consumer owns, replay is trivial: set the offset back and read the same records again, in the same order. A consumer that has no stored position yet starts where auto.offset.reset says, latest by default, earliest to read everything the log still holds. Reprocessing after a bug, rebuilding a cache, feeding a new system from history: all the same move. Hold on to the picture, because everything that follows is this row of cells, with more of them."]}, {"name": "Partitions", "src": "media/videos/s02_partitions/480p15/Partitions.mp4", "ends": [1.4, 3.667, 8.867, 14.867, 18.2, 20.866], "notes": ["The same picture, rearranged for what comes next: the consumers step aside, the broker shrinks to make room for two more, drawn faintly because they exist in the cluster but hold nothing yet, the producer moves to the top, and a write-load gauge appears at the left. The partition is empty again so that the load can be watched from zero.", "One partition means one file on one broker, and one ordering. Every record of the topic lands on the same disk and goes out through the same network card, and the write load gauge of that broker climbs with the traffic while the two brokers beside it sit idle. The topic's throughput is capped by one machine. The fix is the second word of the spine: split the log.", "Three partitions on three brokers. The producer hashes each record's key and takes the remainder by the number of partitions, so alice's records always go to partition zero, bob's to one, carol's to two; with no key, the producer fills one partition's batch and then moves to another. Each partition is still an append-only log with its own offsets, so every record of one key is in order, and Kafka promises nothing about order between partitions. That is the trade: the topic's load now spreads across three disks, and ordering is per key, not per topic. Choose the key so that the things that must stay ordered share it.", "Now the readers. A consumer group is a set of consumers that share the work of a topic: each partition is read by exactly one member of the group, and each member reads its partitions in order from its own offsets. Three partitions, three consumers, three pointers advancing in parallel: the topic's read throughput now scales with the partition count, which is why partitions are the unit of parallelism on both sides. A second group, say an analytics job, would read the same partitions again with its own pointers.", "Consumer three crashes. Its partition cannot stay unread, so the group rebalances: partition two is assigned to consumer two, which now reads two partitions from their committed offsets. In the classic protocol every member stopped, rejoined and received a new assignment computed by one of the clients; a single slow member could stall the whole group. The protocol that became generally available in Kafka 4.0, KIP-848, has the broker's group coordinator assign partitions and moves them one at a time, so the members that keep their partitions never pause. It is enabled per group with group.protocol=consumer and becomes the default in 5.0.", "Where does a group's position live between restarts? In Kafka itself. Each consumer commits its offset, by default automatically every five seconds, and the commit is a record appended to an internal topic, __consumer_offsets, fifty partitions, keyed by group and partition and compacted so only the latest position per key survives. A consumer that restarts reads its last committed offset from there and continues. So the readers' state is kept the same way as the data: as a log. The next problem is the machine under the log."]}, {"name": "Replication", "src": "media/videos/s03_replication/480p15/Replication.mp4", "ends": [2.133, 9.732, 13.665, 16.398, 22.397, 24.73], "notes": ["The three brokers of the last move stack up, and the picture is now one partition on three of them. Broker one leads; brokers two and three are followers with empty copies. The producer writes to the leader with acks=all, the consumer fetches from the leader, the in-sync markers at the bottom right say which copies are current, and the green line is the high-water mark, the offset up to which everything is committed. Nothing has been written yet.", "One partition, three copies. The broker that leads takes the writes; the two followers fetch from the leader exactly as a consumer would and append the same records at the same offsets. With acks=all, the default since Kafka 3.0, the producer is not told that a record is written until every replica in the in-sync set has it. The green marker is the high-water mark: the last offset all in-sync replicas hold. Consumers are only ever given records below it, so a record a consumer has seen can never disappear in a failover. Three replicas is the common production setting: f plus one copies survive f broker failures without losing a committed record.", "Broker three falls behind: a slow disk, a network partition, a garbage-collection pause. The leader keeps track of how long each follower has been behind, and after replica.lag.time.max.ms, thirty seconds by default, it drops the follower from the in-sync set. That set is written into the cluster metadata, so everyone agrees on it. From now on a record is committed once brokers one and two have it: the high-water mark moves again, and the producer gets its acknowledgements back. Durability shrank from three copies to two, quietly, which is why the in-sync replica count is the number to alarm on.", "Then broker two falls behind too, and the in-sync set is the leader alone. A record could still be appended to the leader's log, but it would be committed on one disk, and acknowledged as safe. min.insync.replicas is the floor that prevents this: set to two, the leader refuses acks=all writes while fewer than two replicas are in sync, and the producer sees NotEnoughReplicas and retries instead of being lied to. The default is one; production clusters with three replicas set it to two. Availability for writes is traded for the promise that nothing acknowledged lives on a single machine.", "The followers catch up, all three are in sync again, and then broker one dies. Its log is gone from the picture. The controller, which we meet in the last move, picks a new leader from the in-sync set, broker two here, and tells producers and consumers, who reconnect to it. Because every committed record was on every in-sync replica, the new leader has all of them: the high-water mark is exactly where it was, the consumer continues from the same offset, and the producer's next records go to broker two and are copied to broker three. A replica that was out of sync may not become leader while unclean.leader.election.enable is false, the default; turning it on trades the loss of the records that replica missed for availability when the whole in-sync set is gone.", "Broker one comes back. It is not the leader any more; it rejoins as a follower, fetches what it missed from broker two, and once it has caught up it is back in the in-sync set. Leadership is per partition, so on a real cluster every broker leads some partitions and follows others, and the controller spreads leaders evenly so that no single machine takes all the writes. Three copies, one in-sync set, one high-water mark: that is the whole of Kafka's durability story, and the next move is about the disks those copies sit on."]}, {"name": "Retention", "src": "media/videos/s04_retention/480p15/Retention.mp4", "ends": [2.133, 5.933, 8.399, 12.466], "notes": ["Broker two's copy of the partition, opened up: its eight records are the first segment file, and the records that arrived since fill two more. Zoom in on one partition's directory. The log is not one file but a sequence of segment files, each named by the offset of the first record it holds, so finding offset twelve is a binary search over file names and then an index lookup inside one file. A segment rolls when it reaches log.segment.bytes, one gibibyte by default, or after log.roll.hours, a week. Only the last segment, the active one, is ever appended to; the others are immutable, which is what makes the next two mechanisms cheap: deleting a segment is unlinking a file.", "Retention is the default cleanup policy: keep records for log.retention.hours, one hundred and sixty-eight by default, or until the partition exceeds log.retention.bytes, and delete by removing the oldest segment whole. It is time or size, per topic, whichever comes first, and it happens whether or not anyone has read the records: reading never deletes and deleting never asks. A consumer that was slow enough to still point into the deleted segment has an offset that no longer exists; it is reset by auto.offset.reset, to the oldest remaining record with earliest or to the end with latest, and either way it has lost data. Lag against retention is the other number to alarm on.", "The other cleanup policy is for topics where a record means the current state of its key: an account balance, a user's profile, a committed offset. Compaction keeps, for every key, at least the most recent record, and a background cleaner rewrites the older segments to drop the rest. Offsets are never renumbered, so the compacted tail has gaps, and a consumer that reads from the beginning still gets a complete, if abbreviated, history: the latest value of every key. This is how a topic becomes a table you can rebuild from, and it is exactly how __consumer_offsets and Kafka's own metadata log are kept small.", "How do you delete a key from a log that only appends? You append a tombstone: the key with a null value. The cleaner treats it as the key's latest state and drops every earlier record for that key, and after delete.retention.ms, a day by default, drops the tombstone too, so a consumer that started in that window saw the deletion and a later one sees nothing at all. Same log, same offsets, same readers; the only thing that changed is which old records the cleaner is allowed to forget. One question remains: who decides which broker leads a partition, which replicas are in sync, and where a partition lives at all."]}, {"name": "Controller", "src": "media/videos/s05_controller/480p15/Controller.mp4", "ends": [2.0, 5.932, 7.332], "notes": ["The compacted topic of the last move slides up and becomes something else: the cluster's own metadata log, kept exactly the same way. Every decision so far, which broker leads a partition, which replicas are in sync, where a topic's partitions live, is metadata, and something has to hold it and agree on it. Since Kafka 4.0 that is a quorum of controllers, three or five machines, running the Raft protocol over a log of their own, the __cluster_metadata topic. One controller is active and appends the changes; the others replicate the log and can take over in seconds. Every broker fetches that log from the active controller and keeps a local copy, so it learns cluster state the way a consumer learns anything: by reading a log from an offset.", "Broker three stops sending heartbeats and the active controller fences it: that decision is one record appended to the metadata log, replicated to the other controllers, and committed once a majority has it. Brokers one and two fetch the record, learn that broker three is out, and that the partitions it led now have a new leader from their in-sync sets, the failover of the replication move seen from above. Because it is a log, every broker sees the same changes in the same order and can catch up from where it left off, which is what let Kafka drop its dependency on ZooKeeper and scale to millions of partitions.", "Kafka 4.0, released in March 2025, runs only this way; the ZooKeeper mode that held the metadata for fifteen years was removed, and the last release that could bridge from it is 3.9. So the talk ends where it started. A topic is an append-only log split into partitions, and readers keep an offset into it. Consumers read it that way, followers replicate it that way, the group's positions are stored that way, and the cluster's own state is held that way. When something in Kafka looks complicated, find the log and the offset underneath it, and it usually stops being complicated."]}], "steps": [{"scene": "TheLog", "si": 0, "k": 0, "note": "This talk is for engineers who have produced to or consumed from Kafka and never seen the machinery. One sentence carries it: a topic is an append-only log split into partitions, and every reader keeps one integer, an offset into that log. Ordering, parallelism, replay and durability are consequences of those two facts, and each move shows one of them: the log itself, then partitions, then replication, then what happens when disks fill, then who decides. The starting picture, nothing moving yet. A producer on the left. A broker, one machine, holding one topic with a single partition: the empty rail is where records will land, and the numbers that will appear under them are offsets. The legend says what the colours mean: each record is drawn in the colour of its key, alice, bob, carol. Everything in this talk happens to this row of cells."}, {"scene": "TheLog", "si": 0, "k": 1, "note": "Start with one producer, one broker and one topic with a single partition. A record is a key, a value and a timestamp; here the colour is the key: alice, bob, carol. Each record the producer sends lands at the end of the partition and gets the next offset, a num
