<!doctype html><meta charset="utf-8"><title>Talk title</title>
<style>html,body{margin:0;height:100%;background:#0f1116;overflow:hidden;font:16px Helvetica,sans-serif;color:#e8e8e8}
video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#0f1116}
#hint{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(15,17,22,.85);cursor:pointer}
#hint b{font-size:28px;font-weight:500} #hint span{color:#9aa0ad}</style>
<video id="a" playsinline preload="auto" muted></video><video id="b" playsinline preload="auto" muted></video>
<div id="hint"><b>Talk title</b><span>5 steps. Click or right arrow to advance, left to go back, f for full screen.</span><span>Open presenter.html for notes and remote control.</span></div>
<script>
const ch=new BroadcastChannel('talk');const tell=m=>{ch.postMessage(m);if(window.opener)window.opener.postMessage(m,'*');};
let onstep=k=>{document.getElementById('hint')?.remove();tell({at:k});};
const handle=d=>{if(!d)return;if(d.go!==undefined)show(d.go);if(d.hello)tell({at:i});};

const D={"scenes": [{"name": "Opening", "src": "media/videos/s00_title/480p15/Opening.mp4", "ends": [7.933], "notes": ["Who the talk is for and what they will be able to do afterwards. The spine sentence, said once, slowly. Then the map: the moves in order, one line each, so the audience knows where they are for the next forty minutes."]}, {"name": "Example", "src": "media/videos/s01_example/480p15/Example.mp4", "ends": [3.333, 5.8, 7.533, 15.066], "notes": ["The simplest picture: one client, one server, one request. The request travels, the server takes it into a slot, the load gauge moves a little, the counter says one. Everything the talk will say is a change to this picture.", "Five requests arrive together. Same picture, more of it: each takes a slot, the gauge climbs with every one, and the fifth fills the server. The problem the next scene solves is now visible: the gauge is red.", "Zoom in and the box opens: this is what one request occupies while it is being served. Small text here is rendered large and scaled down, so it stays crisp.", "Back out, and the picture grows to the right: a store, and every served request leaves a record in it as its slot empties. The caption is one quiet line, set before the animation. The next scene starts from exactly this frame."]}], "steps": [{"scene": "Opening", "si": 0, "k": 0, "note": "Who the talk is for and what they will be able to do afterwards. The spine sentence, said once, slowly. Then the map: the moves in order, one line each, so the audience knows where they are for the next forty minutes."}, {"scene": "Example", "si": 1, "k": 0, "note": "The simplest picture: one client, one server, one request. The request travels, the server takes it into a slot, the load gauge moves a little, the counter says one. Everything the talk will say is a change to this picture."}, {"scene": "Example", "si": 1, "k": 1, "note": "Five requests arrive together. Same picture, more of it: each takes a slot, the gauge climbs with every one, and the fifth fills the server. The problem the next scene solves is now visible: the gauge is red."}, {"scene": "Example", "si": 1, "k": 2, "note": "Zoom in and the box opens: this is what one request occupies while it is being served. Small text here is rendered large and scaled down, so it stays crisp."}, {"scene": "Example", "si": 1, "k": 3, "note": "Back out, and the picture grows to the right: a store, and every served request leaves a record in it as its slot empties. The caption is one quiet line, set before the animation. The next scene starts from exactly this frame."}]};const S=D.scenes,ST=D.steps;let i=-1;
const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element
    if(vids[other()].dataset.si!==String(st.si))load(vids[other()],st.si);
    const v=vids[other()];v.currentTime=start;cur=other();
    vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
    v.play().catch(()=>{});if(ST[k+1]&&ST[k+1].si!==st.si)load(vids[1-cur],ST[k+1].si);
    if(S[st.si+1])load(vids[1-cur],st.si+1);
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});}
  hold(vids[cur],end);onstep&&onstep(k);
}
let holdId=0;
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.03){v.pause();v.currentTime=end-0.001;return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}

load(vids[0],0);if(S[1])load(vids[1],1);
document.getElementById('hint').addEventListener('click',e=>{e.stopPropagation();show(0);});   // the same click must not also count as 'next'
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')next();else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(e.key==='f')document.documentElement.requestFullscreen();else if(e.key==='Home')show(0);});
document.addEventListener('click',e=>{if(i>=0)next();});
ch.onmessage=e=>handle(e.data);window.addEventListener('message',e=>handle(e.data));
</script>
