<!doctype html><meta charset="utf-8"><title>Presenter</title>
<style>html,body{margin:0;height:100%;background:#15181f;color:#e8e8e8;font:18px/1.5 Helvetica,sans-serif}
#top{display:flex;gap:24px;align-items:center;padding:14px 22px;border-bottom:1px solid #2a2e38;color:#9aa0ad}
#top b{color:#e8e8e8;font-weight:500} #clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:22px}
#main{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;padding:22px}
#nextstage{position:relative;aspect-ratio:16/9;background:#0f1116;border-radius:8px;overflow:hidden;width:62%;margin-bottom:16px} #nextstage video{position:absolute;inset:0;width:100%;height:100%} #nextlabel{font-size:12px;color:#9aa0ad;letter-spacing:.04em;margin-bottom:4px}
#stage{position:relative;aspect-ratio:16/9;background:#0f1116;border-radius:8px;overflow:hidden} #stage video{position:absolute;inset:0;width:100%;height:100%}
#note{font-size:21px;line-height:1.55;color:#f2f2f2} #note h3{margin:0 0 10px;font-weight:500;color:#58c4dd;font-size:16px;letter-spacing:.02em}

#keys{padding:0 22px 16px;color:#5b6070;font-size:14px} button{background:#242833;color:#e8e8e8;border:1px solid #3a3f4b;border-radius:6px;padding:6px 14px;font:16px Helvetica;cursor:pointer}</style>
<div id="top"><button onclick="open_audience()">open audience window</button><button onclick="send(-1)">back</button><button onclick="send(1)">next</button><span id="pos"></span><b id="scene"></b><span id="clock">00:00</span></div>
<div id="main"><div id="stage"><video id="a" muted playsinline preload="auto"></video><video id="b" muted playsinline preload="auto"></video></div>
<div><div id="nextlabel">NEXT: WHERE THE CLICK ENDS UP</div><div id="nextstage"><video id="n" muted playsinline preload="auto"></video></div><div id="note"><h3></h3><div id="txt"></div></div><div id="nextnote"></div></div></div>
<div id="keys">Keys: right or space next, left back, Home first step, t reset timer. The audience window follows this one.</div>
<script>
const ch=new BroadcastChannel('talk');const t0=[Date.now()];let aud=null;
const tell=m=>{ch.postMessage(m);if(aud&&!aud.closed)aud.postMessage(m,'*');};
let onstep=k=>{const s=ST[k],n=ST[k+1];document.getElementById('pos').textContent=(k+1)+' / '+ST.length;document.getElementById('scene').textContent=s.scene;
document.querySelector('#note h3').textContent=s.scene.replace(/([a-z])([A-Z])/g,'$1 $2');document.getElementById('txt').textContent=s.note;
document.getElementById('nextnote').textContent=n?('next: '+n.scene+(n.scene!==s.scene?' (new scene)':'')+'. '+n.note.slice(0,240)+(n.note.length>240?'...':'')):'end of talk';
preview(n);};
function preview(n){const nv=document.getElementById('n');if(!n){nv.removeAttribute('src');nv.load();return;}const sc=S[n.si],at=Math.max(0,sc.ends[n.k]-0.05);   // the last frame of the next step: where 'next' will end up
  const seek=()=>{nv.pause();nv.currentTime=at;};if(nv.dataset.si!==String(n.si)){nv.dataset.si=n.si;nv.src=sc.src;nv.addEventListener('loadedmetadata',seek,{once:true});nv.load();}else seek();}

const D={"scenes": [{"name": "Opening", "src": "media/videos/s00_title/480p15/Opening.mp4", "ends": [7.933], "notes": ["This talk is for engineers who use kubectl every day and have never watched the machinery. In fifteen minutes we follow one command, kubectl apply of a Deployment with three replicas, from the moment it reaches the API server to three running containers, and then break a node to see the same machinery again. One sentence carries it: you write the state you want into one database, and independent loops each watch it and take one step toward it, forever. Blue is what you asked for, yellow is what actually runs, violet is the control plane closing the gap, teal is the machines. Five moves."]}, {"name": "ApplyRequest", "src": "media/videos/s01_apply/480p15/ApplyRequest.mp4", "ends": [1.999, 6.732, 9.932, 11.465], "notes": ["Start with the command everyone has typed: kubectl apply of a Deployment, three replicas of an image. Look at what the request is: not \"start three containers\", but a description of a state, replicas three, this image. The client sends that description to the API server, the only door into the cluster, and under the API server sits etcd, the database that will hold it. Nothing on the right yet; we get there.", "The request passes three gates inside the API server, in this order. Authentication: who are you; a certificate, a token, a service account. Authorisation: may this user do this to this object; RBAC, and a no is a 403. Admission: controllers that can change or reject the object itself; this is where defaults are filled in, quotas enforced, policies applied, and it runs only for writes. Then the object is validated and written to etcd, and the client hears \"created\". That is the whole of what kubectl apply did: a record now exists.", "etcd is not one machine. It is usually three, sometimes five, and a write counts as done when a majority has it: for n members, n over two plus one. Three members means one can die and every write still lands; five tolerates two. That is why control planes come in odd numbers, and why everything Kubernetes knows survives a lost machine. Hold on to this: the database is the only thing that has to be durable. Everything else can be restarted and will rebuild itself from these records.", "Here are the machines: three nodes, each with a kubelet, some memory in use already, empty slots for pods. And here is the punchline of move one: nothing has happened to them. The API server did not talk to a node. kubectl did not start anything. There is a record that says three, and a count of running pods that says zero. The whole of Kubernetes is what closes that gap, and it does it with loops."]}, {"name": "Controllers", "src": "media/videos/s02_controllers/480p15/Controllers.mp4", "ends": [4.399, 12.799, 14.665], "notes": ["A controller is a loop with three verbs: observe, compare, act. It watches the API server for records of one kind, compares what the records ask for with what exists, and if there is a gap, acts, by writing another record through the same API server. The Deployment controller observes our Deployment, compares: it should own one ReplicaSet with this template, it owns none, and acts: it creates that ReplicaSet record, replicas three, image v1. Then it observes again, and now there is nothing to do, so it waits. It never started a container; it wrote a record.", "The ReplicaSet controller is the same loop for a different record. Open it up: it wants three Pods that match the template, it has zero, the gap is three, so it acts three times, and three Pod records land in etcd. Read the detail line: no node. A Pod record is still a description; nothing has been placed anywhere and nothing runs. The counter at the bottom still says zero. Two loops have run, and all they produced was more records.", "One more thing to see before anything runs: the lines. Both loops watch the API server and write to the API server. They do not talk to each other, they do not talk to nodes, they do not know the other exists. The Deployment controller does not know what a node is. That is why the pieces can be simple and can fail: kill the ReplicaSet controller and the records wait for it; restart it and it observes, compares, and carries on. The database is the coordination. Now: something has to turn a Pod record into a process."]}], "steps": [{"scene": "Opening", "si": 0, "k": 0, "note": "This talk is for engineers who use kubectl every day and have never watched the machinery. In fifteen minutes we follow one command, kubectl apply of a Deployment with three replicas, from the moment it reaches the API server to three running containers, and then break a node to see the same machinery again. One sentence carries it: you write the state you want into one database, and independent loops each watch it and take one step toward it, forever. Blue is what you asked for, yellow is what actually runs, violet is the control plane closing the gap, teal is the machines. Five moves."}, {"scene": "ApplyRequest", "si": 1, "k": 0, "note": "Start with the command everyone has typed: kubectl apply of a Deployment, three replicas of an image. Look at what the request is: not \"start three containers\", but a description of a state, replicas three, this image. The client sends that description to the API server, the only door into the cluster, and under the API server sits etcd, the database that will hold it. Nothing on the right yet; we get there."}, {"scene": "ApplyRequest", "si": 1, "k": 1, "note": "The request passes three gates inside the API server, in this order. Authentication: who are you; a certificate, a token, a service account. Authorisation: may this user do this to this object; RBAC, and a no is a 403. Admission: controllers that can change or reject the object itself; this is where defaults are filled in, quotas enforced, policies applied, and it runs only for writes. Then the object is validated and written to etcd, and the client hears \"created\". That is the whole of what kubectl apply did: a record now exists."}, {"scene": "ApplyRequest", "si": 1, "k": 2, "note": "etcd is not one machine. It is usually three, sometimes five, and a write counts as done when a majority has it: for n members, n over two plus one. Three members means one can die and every write still lands; five tolerates two. That is why control planes come in odd numbers, and why everything Kubernetes knows survives a lost machine. Hold on to this: the database is the only thing that has to be durable. Everything else can be restarted and will rebuild itself from these records."}, {"scene": "ApplyRequest", "si": 1, "k": 3, "note": "Here are the machines: three nodes, each with a kubelet, some memory in use already, empty slots for pods. And here is the punchline of move one: nothing has happened to them. The API server did not talk to a node. kubectl did not start anything. There is a record that says three, and a count of running pods that says zero. The whole of Kubernetes is what closes that gap, and it does it with loops."}, {"scene": "Controllers", "si": 2, "k": 0, "note": "A controller is a loop with three verbs: observe, compare, act. It watches the API server for records of one kind, compares what the records ask for with what exists, and if there is a gap, acts, by writing another record through the same API server. The Deployment controller observes our Deployment, compares: it should own one ReplicaSet with this template, it owns none, and acts: it creates that ReplicaSet record, replicas three, image v1. Then it observes again, and now there is nothing to do, so it waits. It never started a container; it wrote a record."}, {"scene": "Controllers", "si": 2, "k": 1, "note": "The ReplicaSet controller is the same loop for a different record. Open it up: it wants three Pods that match the template, it has zero, the gap is three, so it acts three times, and three Pod records land in etcd. Read the detail line: no node. A Pod record is still a description; nothing has been placed anywhere and nothing runs. The counter at the bottom still says zero. Two loops have run, and all they produced was more records."}, {"scene": "Controllers", "si": 2, "k": 2, "note": "One more thing to see before anything runs: the lines. Both loops watch the API server and write to the API server. They do not talk to each other, they do not talk to nodes, they do not know the other exists. The Deployment controller does not know what a node is. That is why the pieces can be simple and can fail: kill the ReplicaSet controller and the records wait for it; restart it and it observes, compares, and carries on. The database is the coordination. Now: something has to turn a Pod record into a process."}]};const S=D.scenes,ST=D.steps;let i=-1;
const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element
    if(vids[other()].dataset.si!==String(st.si))load(vids[other()],st.si);
    const v=vids[other()];v.currentTime=start;cur=other();
    vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
    v.play().catch(()=>{});if(ST[k+1]&&ST[k+1].si!==st.si)load(vids[1-cur],ST[k+1].si);
    if(S[st.si+1])load(vids[1-cur],st.si+1);
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});}
  hold(vids[cur],end);onstep&&onstep(k);
}
let holdId=0;
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.03){v.pause();v.currentTime=end-0.001;return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}

load(vids[0],0);if(S[1])load(vids[1],1);
function open_audience(){aud=window.open('present.html','audience','width=1280,height=720');setTimeout(()=>tell({go:Math.max(0,i)}),1500);}
function send(d){const k=Math.max(0,Math.min(ST.length-1,i+d));tell({go:k});show(k);}
const handle=d=>{if(d&&d.at!==undefined&&d.at!==i)show(d.at);};
ch.onmessage=e=>handle(e.data);window.addEventListener('message',e=>handle(e.data));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')send(1);else if(e.key==='ArrowLeft')send(-1);else if(e.key==='Home'){tell({go:0});show(0);}else if(e.key==='t')t0[0]=Date.now();});
setInterval(()=>{const s=Math.floor((Date.now()-t0[0])/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);
show(0);tell({hello:1});
</script>
