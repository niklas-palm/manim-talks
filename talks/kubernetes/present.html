<script>
const ch=new BroadcastChannel('talk');const tell=m=>{ch.postMessage(m);if(window.opener)window.opener.postMessage(m,'*');};

const D={"scenes": [{"name": "Opening", "src": "media/videos/s00_title/1080p60/Opening.mp4", "ends": [7.883], "notes": ["This talk is for engineers who use kubectl every day and have never watched the machinery. In fifteen minutes we follow one command, kubectl apply of a Deployment with three replicas, from the moment it reaches the API server to three running containers, and then break a node to see the same machinery again. One sentence carries it: you write the state you want into one database, and independent loops each watch it and take one step toward it, forever. Blue is what you asked for, yellow is what actually runs, violet is the control plane closing the gap, teal is the machines. Five moves."]}, {"name": "ApplyRequest", "src": "media/videos/s01_apply/1080p60/ApplyRequest.mp4", "ends": [2.6, 6.1, 10.5, 13.2], "notes": ["Start with the command everyone has typed: kubectl apply of a Deployment, three replicas of an image. Look at what the request is: not \"start three containers\", but a description of a state, replicas three, this image. The client sends that description to the API server, the only door into the cluster, and under the API server sits etcd, the database that will hold it. Nothing on the right yet; we get there.", "Inside the API server the request passes three gates, in this order. Authentication: who are you; a certificate, a token, a service account, and a failure is a 401. Authorisation: may this user do this to this object; RBAC, and a no is a 403. Admission: controllers that can change or reject the object itself; this is where defaults are filled in, quotas enforced, policies applied, and it runs only for writes. Then the object is validated and goes to the store.", "The record lands in etcd, and etcd is not one machine. It is usually three, sometimes five, and a write counts as done when a majority has it: for n members, n over two plus one, so two of three. Only then does the client hear \"created\". Watch one member die: the write still lands on two, and nothing stops; five members tolerate two failures. That is why control planes come in odd numbers, and why the database is the only thing that has to be durable: everything else can be restarted and will rebuild itself from these records.", "Here are the machines: three nodes, each with a kubelet, some memory already in use, empty slots for pods. And here is the punchline of move one: nothing has happened to them. The API server did not talk to a node. kubectl did not start anything. There is a record that says three, and a count of running pods that says zero. The whole of Kubernetes is what closes that gap, and it does it with loops."]}, {"name": "Controllers", "src": "media/videos/s02_controllers/1080p60/Controllers.mp4", "ends": [4.0, 11.7, 13.8], "notes": ["A controller is a loop with three verbs: observe, compare, act. It watches the API server for records of one kind, compares what the records ask for with what exists, and if there is a gap, acts, by writing another record through the same API server. The Deployment controller observes our Deployment, compares: it should own one ReplicaSet with this template, it owns none, and acts: it creates that ReplicaSet record, replicas three, image v1. Then it observes again, and now there is nothing to do, so it waits. It never started a container; it wrote a record.", "The ReplicaSet controller is the same loop for a different record. Open it up: it wants three Pods that match the template, it has zero, the gap is three, so it acts three times, and three Pod records land in etcd. Read the status line: no node. A Pod record is still a description; nothing has been placed anywhere and nothing runs. The counter at the bottom still says zero. Two loops have run, and all they produced was more records.", "One more thing to see before anything runs: the lines. Both loops watch the API server and write to the API server. They do not talk to each other, they do not talk to nodes, they do not know the other exists. The Deployment controller does not know what a node is. That is why the pieces can be simple and can fail: kill the ReplicaSet controller and the records wait for it; restart it and it observes, compares, and carries on. The database is the coordination. Now: something has to turn a Pod record into a process."]}, {"name": "SchedulerKubelet", "src": "media/videos/s03_schedule/1080p60/SchedulerKubelet.mp4", "ends": [2.4, 4.9, 9.1, 16.1, 19.5], "notes": ["The scheduler is another loop, and its trigger is the red line on those cards: a Pod record with no node. It watches for exactly those, takes one, and answers one question: which node? It does not start anything either. Its output will be one more field in the record.", "Two steps. First, filtering: which nodes could take this Pod at all? The Pod requests some memory, the blue box against each node's memory bar. Node three does not have that much left, so it is out; there are many such filters, for CPU, for ports, for node selectors and taints, and a node has to pass all of them to be feasible. Two remain. If none remained, the Pod would stay pending, with no node, and the loop would try again later.", "Second, scoring: the feasible nodes are ranked. One common rule prefers the node with the most free resources left, so the load spreads; others prefer spreading replicas across zones, or packing. Node one scores highest. Then the act, called binding: the scheduler writes the node's name into the Pod record through the API server. That is all it does. The card now says node 1. Still nothing runs; but now a record names a machine, and one machine is watching for exactly that.", "The kubelet is the agent on every node, and it is a loop too: it watches the API server for Pod records bound to its own node. Node one's kubelet sees this one. Now, and only now, something happens on a machine: it asks the container runtime to pull the image, creates the container, and starts it. The yellow square is the first real process in this talk. Then it reports back, through the API server, into the same record: node 1, Running. The record and the world now agree, and the counter says one.", "The other two Pods go the same way at speed: the scheduler binds b to node two, the least loaded now, and c back to node one; each kubelet sees its own, pulls, starts, reports. Three desired, three running. And now notice what the loops do: nothing. Each one observes, compares, finds no gap, and waits for the next change. A healthy cluster is a set of loops with nothing to do. The next move gives them something."]}, {"name": "NodeDies", "src": "media/videos/s04_node_dies/1080p60/NodeDies.mp4", "ends": [2.9, 10.1, 15.95], "notes": ["Three running, three desired, and the loops idle. One more loop was working all along, quietly: every kubelet tells the API server it is alive, renewing a lease every ten seconds, the teal dots. The node controller, part of the control plane, watches those leases. Nothing else on this picture depends on it, until a machine goes.", "Node two goes silent: a kernel panic, a pulled cable, a cloud instance retired. Nothing reports it. What the node controller sees is an absence: no lease renewal. It gives the node forty seconds of grace, then marks it NotReady and puts a taint on it. Pods carry a default toleration of three hundred seconds for that taint, so for five more minutes the picture waits, in case the node comes back. It does not; at three hundred and forty seconds the Pod on it is evicted: its record is marked for deletion. Now the counter says two. That is the only thing that happened: a record went away and a count dropped.", "And here is the point of the move: nothing new happens. The ReplicaSet controller observes three Pod records where it wants three, but one is gone: wants three, has two, act once, a new Pod record with no node. The scheduler sees a Pod with no node: node two is filtered out for being NotReady, node three for memory, node one wins, bind. Node one's kubelet sees a Pod bound to it: pull, start, report. Three running. Self-healing is not a feature that was added; it is what loops do when the gap reopens. The same is true of scaling, of a deleted Pod, of a rollback: change a record, and the loops close the gap."]}, {"name": "ServiceRollout", "src": "media/videos/s05_service_rollout/1080p60/ServiceRollout.mp4", "ends": [1.8, 6.55, 9.35, 10.55, 17.25, 18.85], "notes": ["Node two is back, and on it runs a frontend that needs the web pods. Each pod has its own IP address, and the set changes: d replaced b in the last move and has a new address; the next rollout will replace all three. A client cannot keep a list. This is the problem a Service solves, and it is solved with, once more, a record and a loop.", "A Service is a record: a name, a selector, app equals web, and a virtual address the control plane assigns, the cluster IP, 10.96.0.10, which never changes while the Service exists. The EndpointSlice controller watches Services and Pods, and derives another record: the list of ready pod addresses that match the selector, right now. Every time a pod comes or goes, this list is rewritten. Nothing routes yet; a list exists.", "kube-proxy runs on every node and is, again, a loop: it watches Services and EndpointSlices and programs the node's packet rules so that anything sent to the cluster IP is rewritten to one of the addresses in the list, chosen at random by default. The frontend talks to 10.96.0.10 and lands on c, then on a. It never learns a pod address, and when the list changes, the rules change under it. A stable address is a record plus a loop on every machine.", "Now change what you want: kubectl set image to v2 edits one field of the Deployment record. The Deployment controller observes a template that no ReplicaSet matches and creates a second ReplicaSet, v2, at zero replicas. It will now scale the two in opposite directions, under two limits from the record's defaults: at most twenty-five percent extra pods, rounded up, so one above three; and at most twenty-five percent unavailable, rounded down, so zero below three. The old ReplicaSet stays, at zero, for rollback; ten are kept by default.", "Watch the two ReplicaSets and the list. v2 scales to one: a new pod, outlined, is scheduled and started, and only when it is ready does it enter the EndpointSlice, four addresses. Then v1 scales to two: an old pod leaves the list first, three addresses, then is stopped. Then v2 to two, v1 to one, v2 to three, v1 to zero. At every moment three pods are ready and at most four exist: the two limits, kept by the controller step by step. The frontend never noticed; it kept sending to the same address, and the list under it changed six times.", "And rollback is not a separate mechanism either. kubectl rollout undo sets the Deployment's template back to v1; the Deployment controller sees a template that the old ReplicaSet matches, and scales the two the other way under the same limits. Everything in this talk was one shape: write a record, and independent loops each take one step toward it. Apply, schedule, run, heal, expose, roll out, roll back: a gap between desired and actual, and a loop that closes it."]}], "steps": [{"scene": "Opening", "si": 0, "k": 0, "note": "This talk is for engineers who use kubectl every day and have never watched the machinery. In fifteen minutes we follow one command, kubectl apply of a Deployment with three replicas, from the moment it reaches the API server to three running containers, and then break a node to see the same machinery again. One sentence carries it: you write the state you want into one database, and independent loops each watch it and take one step toward it, forever. Blue is what you asked for, yellow is what actually runs, violet is the control plane closing the gap, teal is the machines. Five moves."}, {"scene": "ApplyRequest", "si": 1, "k": 0, "note": "Start with the command everyone has typed: kubectl apply of a Deployme const vids=[document.getElementById('a'),document.getElementById('b')];let cur=0;   // vids[cur] is on top
function other(){return 1-cur}
function load(v,si){if(v.dataset.si!==String(si)){v.dataset.si=si;v.src=S[si].src;v.load();}}
function show(k){                     // play from the start of step k to its end, then hold the frame
  if(k<0||k>=ST.length)return;const st=ST[k],sc=S[st.si],prev=i>=0?ST[i]:null;i=k;
  const start=st.k?sc.ends[st.k-1]:0,end=sc.ends[st.k];
  if(!prev||prev.si!==st.si){            // new scene: bring up the preloaded element
    if(vids[other()].dataset.si!==String(st.si))load(vids[other()],st.si);
    const v=vids[other()];v.currentTime=start;cur=other();
    vids[cur].style.zIndex=2;vids[1-cur].style.zIndex=1;
    v.play().catch(()=>{});if(ST[k+1]&&ST[k+1].si!==st.si)load(vids[1-cur],ST[k+1].si);
    if(S[st.si+1])load(vids[1-cur],st.si+1);
  }else{const v=vids[cur];if(Math.abs(v.currentTime-start)>0.25)v.currentTime=start;v.play().catch(()=>{});}
  hold(vids[cur],end);onstep&&onstep(k);
}
let holdId=0;
function hold(v,end){cancelAnimationFrame(holdId);const tick=()=>{if(v.currentTime>=end-0.03){v.pause();v.currentTime=end-0.001;return;}holdId=requestAnimationFrame(tick);};holdId=requestAnimationFrame(tick);}
function next(){show(i+1)} function prev(){show(i-1)}

load(vids[0],0);if(S[1])load(vids[1],1);
document.getElementById('hint').addEventListener('click',e=>{e.stopPropagation();show(0);});   // the same click must not also count as 'next'
